openapi: 3.1.0

info:
  title: FRUS API
  version: 0.4.0-draft
  description: |
    # FRUS API — Draft Specification

    This document is the authoritative draft specification for a purpose-built
    FRUS API that would replace FRUS Explorer's current approach of calling the
    GitHub API for manifest data and downloading full volume XML files for local
    parsing.

    ## Version History

    | Version | Sessions | Changes |
    |---------|----------|---------|
    | 0.1.0-draft | 11–28 | Initial endpoints: volumes, documents, search, subjects |
    | 0.2.0-draft | 28–39 | Cross-reference graph, page ranges, citation lookup, person-ref search param |
    | 0.3.0-draft | 40–150 | `dateISO` on `DocumentBrowserEntry` and `SearchResult`; new `/persons`, `/terms`, `/html`, and `/source-notes` endpoints; `DocumentHighlight` schema; `StructuredSourceNote` schema; `PersonEntry` and `GlossEntry` schemas |
    | 0.4.0-draft | Query & Corpus Analysis wave (PRs #582–#634) | Corpus-scale analysis endpoints the wave could not afford on device: `/corpus/vocabulary`, `/corpus/term-statistics`, `/analysis/term-ranking`, `/analysis/collocates`, `/analysis/term-distribution`, `/search/concordance`, `/documents/{id}/similar`, `/documents/{id}/reprints`; `facets` on `/search` |

    ## Purpose

    FRUS Explorer currently accesses FRUS data through two channels:

    1. **GitHub API** — the `HistoryAtState/frus` repository's directory listing
       provides file sizes and SHAs; raw.githubusercontent.com serves the volume
       XML files.
    2. **Local SQLite** — `IndexingPipeline` populates `FTS5Store` and a
       `document_cache` table from the downloaded XML; all document browsing and
       full-text search runs against this local store.

    A purpose-built FRUS API would deliver rich metadata and pre-extracted text
    over HTTPS, eliminating the requirement to download 5–30 MB XML files per volume
    and removing the dependency on GitHub as a data delivery mechanism.

    ## High-Value New Endpoints (v0.3.0)

    Sessions 40–150 revealed four data surfaces that the app currently generates
    through expensive local processing (5–30 MB XML download + SAX parsing +
    AST conversion). Serving these pre-computed server-side would eliminate the
    bulk of on-device processing for most research workflows:

    | Endpoint | Data currently generated by | Processing eliminated |
    |----------|-----------------------------|-----------------------|
    | `GET /volumes/{id}/persons` | `PersonsParserDelegate` + `persons` SQLite table | Full volume XML download + SAX parse |
    | `GET /volumes/{id}/terms` | `TermsParserDelegate` + `terms` SQLite table | Full volume XML download + SAX parse |
    | `GET /volumes/{id}/documents/{id}/html` | `FRUSRenderNodeHTMLSerializer` + `HTMLTemplate` | XML download + AST conversion + HTML serialization |
    | `GET /volumes/{id}/source-notes` | `SourcesParserDelegate` + `SourceNoteParser` + `document_sources` table | XML download + provenance parsing |

    ## Capabilities Priced Out On Device (v0.4.0)

    The Query & Corpus Analysis wave (PRs #582–#634) shipped six analysis
    surfaces — result-set facets, a KWIC concordance, keyness, collocation,
    per-period occurrence measures, and working corpora. Every one of them is
    bounded on device by the same two constraints, and both are constraints
    only the publisher can lift.

    **1. The library fence.** Every local measure runs against the volumes the
    researcher has actually downloaded and indexed — in practice a handful of
    the 552 in the manifest. The statistic is not wrong, but it is not a
    statement about FRUS, and five PRs in this wave (#604, #605, #608, #611,
    #616) went to labelling which set each number describes. The endpoints
    below compute over the published corpus, so the answer means what a
    researcher assumes it means.

    **2. The bundled-reference ceiling.** Where a measure needs corpus-wide
    reference data, the app ships a precomputed artifact. That works, and it
    has a fixed price: the bundled JSON footprint is 12.32 MB;
    `keyness-baseline.json` retains only the top 20,000 terms per lens (the
    `allTerms` cut falls at a corpus count of 110, `topics` at 65), so rarer
    terms are reported as *unpriced* rather than scored; the cloud vectors keep
    the top 50 terms per scope; and a full `CloudVectorsGenerator` run takes
    50–60 minutes, which is why the reference is pinned to one tokenisation and
    `BundledKeynessBaseline` withholds keyness entirely
    (`.unavailable(.configurationMismatch)`) when the researcher changes a
    tokenisation setting the artifact was not built under.

    | Endpoint | What it unblocks | Priced out on device because |
    |----------|------------------|------------------------------|
    | `GET /corpus/vocabulary` | D-1a/D-1b — showing which real words a stemmed index term stands for | `fts5vocab` has no index behind `doc`/`cnt`, so any ranked browse is a full scan of 274,927 stems; the shipped fallback derives variants from the app's English lexicon and must therefore say "words with this root **include**…", never "are" |
    | `POST /corpus/term-statistics` | The reference side of keyness and collocation, untruncated and under the caller's own tokenisation | `keyness-baseline.json` is a 20,000-term-per-lens head fixed at `WordCloudTuning.standard`; below the cut a term is unpriced, and a settings change makes the whole measure unavailable |
    | `POST /analysis/term-ranking` | S-1 keyness and the word cloud over any scope, including scopes the library does not hold | Scope vectors are bundled at top-50 per scope, and a date-range cloud silently keeps only the earliest 5,000 documents (`WordCloudScopeResolver.dateRangeKeyLimit`) |
    | `POST /analysis/collocates` | S-2 collocation over a whole result set rather than a retained page of it | The scan is capped at 200,000 window tokens (~2.5 s of `NLTagger` work at the measured 80,124 tokens/sec) over a result set itself retained at 1,000 (iOS) / 7,500 (macOS); the plan's own scope note concedes "the whole corpus is not" affordable |
    | `GET /analysis/term-distribution` | R-2 occurrence, dispersion and normalised time series | Instance-mode counting is honest for a single-word query only (`OccurrenceAvailability`): exact-word is impossible from a stemmed index, and phrase/prefix/`NEAR`/boolean shapes have no single honest total. A `the`-class term costs 2.03 s and returns 314,609 rows, and the iPhone case was never measured |
    | `GET /search/concordance` | R-3b KWIC reading across the whole match, sorted on left or right context | `SearchService.concordance` deliberately takes *the displayed page*: the retained macOS set would be a 37 MB body-text fetch for a view showing twenty lines. Local alignment also uses the Swift `PorterStemmer` where the index used SQLite's, so some matched documents contribute no line at all |
    | `GET /volumes/{id}/documents/{id}/similar` | The lexical-neighbour axis withdrawn on 2026-08-01 | An all-pairs pass over ~314k documents is not an on-device computation, a top-10-per-document index is ~40–45 MB of JSON, and the thresholded alternative measured 3.9–4.6 MB against a 3.5 MB bar. The fatal objection was coverage, not size: neighbours are reserved ≥80% cross-volume, every local path drops a candidate with no `document_cache` row, and at a 40-volume library that leaves 7.5–13% effective document coverage |
    | `GET /volumes/{id}/documents/{id}/reprints` | The piece of that assessment that survived: "also printed as Doc 412 in vol. VIII" | Same all-pairs cost, and the payoff is precisely the case the device cannot reach — the citation is the deliverable *because* the other volume is not downloaded |
    | `facets` on `GET /search` | R-1 facets over the whole match, and #586's reachability of a slice | Facet counts are computed over the whole local match while the result list is capped at 1,000/7,500 — a difference surfaces must state rather than smooth over — and reordering buckets means fetching every bucket and sorting client-side |

    Three properties are worth stating once, because every endpoint in the
    group depends on them:

    - **Both key spaces, always.** The local FTS5 index is `porter unicode61`
      **stems**; the keyness reference is `NLTagger` **lemmas**. `alliance`,
      `security`, `defense` and `treaty` are all present as lemmas while
      `allianc`, `secur`, `defens`, `treati` are all absent, which is why
      `BundledKeynessBaseline` refuses the join outright. Responses that carry
      terms therefore name the space they are in, and `/corpus/vocabulary`
      returns the bridge between them.
    - **A bound that bit is data, not a footnote.** Where the app reports
      `wasBounded`, `omittedAnchorCount`, `documentsWithoutLines` or
      `undatedCount`, the equivalent response field is required, so a server
      that does truncate cannot look like one that did not.
    - **Unavailable carries a reason.** The app's rule — never a zero, never a
      blank cell, where the honest answer is "this query shape has no single
      count" — is mirrored in `OccurrenceAvailability` on the response rather
      than left to the client to infer.

    ## Relationship to the Current App

    Each endpoint in this document corresponds to a data access point in the app.
    The `description` of each operation names the Swift type and session where the
    corresponding client logic was implemented, so this document doubles as a
    migration guide: replacing a local data source with a call to the future API
    endpoint is a one-for-one substitution.

    ## Authentication

    All endpoints require an API key passed in the `X-API-Key` request header.
    Keys are issued by the Office of the Historian. In FRUS Explorer the key is
    stored in iCloud Keychain; a missing key causes affected views to display a
    prompt linking to Settings.

    ```
    GET /volumes HTTP/1.1
    X-API-Key: your-api-key-here
    ```

    Public read-only endpoints (volume list, document browse, search) may in future
    support an unauthenticated tier with a lower rate limit. The current draft
    requires authentication for all endpoints.

    ## Rate Limiting

    Rate limit state is communicated through response headers on every call:

    | Header | Description |
    |--------|-------------|
    | `X-RateLimit-Limit` | Maximum requests allowed per window |
    | `X-RateLimit-Remaining` | Requests remaining in the current window |
    | `X-RateLimit-Reset` | Unix timestamp when the window resets |

    When the limit is exceeded the server responds `429 Too Many Requests` with a
    `Retry-After` header.

    ## Pagination

    List endpoints (`GET /volumes`, `GET /volumes/{volumeId}/documents`,
    `GET /search`) accept `limit` and `offset` query parameters. Responses include
    a top-level `total` field giving the overall count. Callers should page until
    `offset + limit >= total`.

    ```json
    {
      "total": 312,
      "items": [ ... ]
    }
    ```

    The `total` field is an approximate count for search endpoints and an exact
    count for browse endpoints.

    ## Error Format

    All error responses use the `Error` schema:

    ```json
    {
      "code": "VOLUME_NOT_FOUND",
      "message": "Volume 'frus1969-76v99' was not found.",
      "detail": null
    }
    ```

  contact:
    name: Office of the Historian, U.S. Department of State
    url: https://history.state.gov
  license:
    name: Apache 2.0
