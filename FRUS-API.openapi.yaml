openapi: 3.1.0

info:
  title: FRUS API
  version: 0.1.0-draft
  description: |
    # FRUS API — Living Specification

    This document describes the ideal FRUS API that could replace FRUS Explorer's
    current approach of calling the GitHub API for manifest data and downloading full
    volume XML files for local parsing.

    ## Purpose

    As FRUS Explorer is developed, each session that introduces a method calling:
    - The GitHub API (manifest, volume downloads)
    - Locally cached FRUS volume XML
    - The HistoryAtState GitHub repository in any form

    ...adds or updates the corresponding endpoint in this document, describing what
    a purpose-built FRUS API could deliver more efficiently.

    ## Status

    This is a living document, not a stable specification. All endpoints are drafts
    subject to revision as development proceeds. Endpoint definitions are added
    session by session as the corresponding client code is written.

    ## Rationale

    The current implementation:
    - Fetches the GitHub directory listing for `HistoryAtState/frus` volumes to get
      file sizes and SHAs (live manifest layer)
    - Downloads complete volume XML files (often 5–30 MB each) to extract metadata
      and full text locally

    A purpose-built FRUS API would deliver:
    - Rich volume metadata without requiring XML download
    - Pre-extracted document text for search indexing
    - Page range data for citation lookup
    - Subject tag appearances per volume

    This document captures what those endpoints would look like, serving as both
    a roadmap for a future official FRUS API and a reference for any future
    migration away from direct GitHub access.

  contact:
    name: Office of the Historian, U.S. Department of State
    url: https://history.state.gov

# Paths are populated session by session as client code is written.
# See DEVELOPMENT-PLAN.md for the session sequence.
paths:

  /volumes:
    get:
      summary: List all FRUS volumes
      description: |
        Returns the full volume manifest: metadata for every published, partially
        published, and planned FRUS volume.

        In the current implementation this data is bundled in `manifest.json`
        (generated by `ManifestGenerator` from TEI headers in the HistoryAtState
        GitHub repository). A future API would serve this endpoint directly.
      operationId: listVolumes
      tags:
        - Volumes
      responses:
        "200":
          description: Array of volume manifest entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolumeManifestEntry"

  /volumes/{volumeId}/download:
    get:
      summary: Download a FRUS volume XML file
      description: |
        Returns the full TEI XML for a single FRUS volume. In the current implementation
        this is served directly from the HistoryAtState GitHub repository via its raw
        content CDN (`raw.githubusercontent.com`). `DownloadManager` constructs the URL
        from the GitHub API directory listing and fetches it with `URLSession`.

        A purpose-built FRUS API would serve this endpoint with HTTP range support
        (for resumable downloads) and pre-compressed payloads.

        Added in Session 05 (Volume Download & Storage Manager).
      operationId: downloadVolume
      tags:
        - Volumes
      parameters:
        - name: volumeId
          in: path
          required: true
          schema:
            type: string
          description: Volume identifier, e.g. `frus1969-76v01`
      responses:
        "200":
          description: Full TEI XML content of the volume
          content:
            application/xml:
              schema:
                type: string
                format: binary
        "404":
          description: Volume not found

  /volumes/{volumeId}/documents:
    get:
      summary: List document metadata for a volume
      description: |
        Returns lightweight metadata for every document in a volume, in source order.
        In the current implementation this is served entirely from the local SQLite
        `document_cache` table populated by `IndexingPipeline`. The volume must be
        indexed before this endpoint is meaningful; an unindexed volume returns an
        empty array.

        Added in Session 11 (Browser View — Compilation/Chapter level).
      operationId: listDocuments
      tags:
        - Documents
      parameters:
        - name: volumeId
          in: path
          required: true
          schema:
            type: string
          description: Volume identifier, e.g. `frus1969-76v01`
      responses:
        "200":
          description: Ordered list of document metadata entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentBrowserEntry"
        "404":
          description: Volume not found

  /volumes/{volumeId}/documents/{documentId}:
    get:
      summary: Retrieve a single FRUS document
      description: |
        Returns the TEI XML fragment for a single document (`<div type="document">`) within
        a volume. In the current implementation there is no document-level API; `FRUSDocumentParser`
        reads the full downloaded volume XML file locally and uses early-abort parsing to extract
        the target document without processing the rest of the file.

        A purpose-built FRUS API would serve individual document fragments, eliminating the need
        to download full volume files for single-document access.

        Added in Session 06 (TEI Parser — Core Elements).
      operationId: getDocument
      tags:
        - Documents
      parameters:
        - name: volumeId
          in: path
          required: true
          schema:
            type: string
          description: Volume identifier, e.g. `frus1969-76v01`
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: Document identifier matching the `xml:id` attribute on `<div type="document">`, e.g. `d1`
      responses:
        "200":
          description: Parsed document as a structured render model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRenderModel"
        "404":
          description: Volume or document not found

  /volumes/{volumeId}/page-ranges:
    get:
      summary: Page range table for a volume
      description: |
        Returns all page-break records extracted from the volume's TEI XML during
        indexing. Used by the Citation Lookup feature (Session 30) to resolve
        citations of the form "FRUS 1969–76 Vol. I, p. 47" to specific documents.

        Added by Session 30 (Citation Lookup) to the Session 09 indexing pipeline.
      operationId: getVolumePageRanges
      tags:
        - Volumes
        - Citation Lookup
      parameters:
        - name: volumeId
          in: path
          required: true
          schema:
            type: string
          description: Volume identifier, e.g. `frus1969-76v01`
      responses:
        "200":
          description: Array of page-range records for the volume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageRangeRecord"
        "404":
          description: Volume not found or not yet indexed

  /search:
    get:
      summary: Full-text search across indexed FRUS documents
      description: |
        Executes a BM25-ranked full-text search across all indexed FRUS volumes.
        Supports keyword queries, phrase search, prefix wildcard, boolean NOT,
        subject-tag filtering, volume-scoped filtering, and optional date-range
        filtering.

        Results are ordered by BM25 relevance (lower score = more relevant).
        Pagination is supported via `limit` and `offset`.

        Added by Session 09 (Search Index Pipeline).
      operationId: searchDocuments
      tags:
        - Search
      parameters:
        - name: keywords
          in: query
          schema:
            type: string
          description: Space-separated keywords combined via boolean AND (default) or OR.
        - name: phrase
          in: query
          schema:
            type: string
          description: Exact phrase that must appear in order.
        - name: booleanMode
          in: query
          schema:
            type: string
            enum: [and, or]
            default: and
          description: How multiple keywords are combined.
        - name: excludedTerms
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Terms that must NOT appear in matching documents.
        - name: prefixWildcard
          in: query
          schema:
            type: string
          description: Prefix for a wildcard search (e.g. `negoti` matches `negotiate`, `negotiated`).
        - name: dateRangeEarliest
          in: query
          schema:
            type: string
            format: date
          description: Only return documents on or after this ISO 8601 date.
        - name: dateRangeLatest
          in: query
          schema:
            type: string
            format: date
          description: Only return documents on or before this ISO 8601 date.
        - name: subjectTagIds
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Restrict to documents carrying ALL of the given subject tag IDs.
        - name: volumeIds
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Restrict results to these volume IDs. Omit to search all indexed volumes.
        - name: includeSummaries
          in: query
          schema:
            type: boolean
            default: true
          description: Whether to search AI-generated summary text.
        - name: includeNotes
          in: query
          schema:
            type: boolean
            default: true
          description: Whether to search user research note text.
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Maximum number of results to return.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip (for pagination).
      responses:
        "200":
          description: Ranked search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          description: Invalid query (e.g. empty query with no searchable terms)

components:
  schemas:

    DateRange:
      type: object
      description: Inclusive date range covered by a volume.
      properties:
        earliest:
          type: string
          format: date
          nullable: true
          description: ISO 8601 date of the earliest document in the volume.
        latest:
          type: string
          format: date
          nullable: true
          description: ISO 8601 date of the latest document in the volume.

    VolumeManifestEntry:
      type: object
      description: |
        Rich metadata for a single FRUS volume, generated from its TEI header.
        The `tags` field contains volume-level subject tag slugs extracted from
        `/TEI/teiHeader/profileDesc/textClass/keywords[@scheme="https://history.state.gov/tags"]/term`.
        These are authoritative OH-curated tags embedded in published TEI.
      required:
        - volumeId
        - filename
        - subseries
        - title
        - dateRange
        - status
        - editors
        - documentCount
        - sizeBytes
        - tags
      properties:
        volumeId:
          type: string
          description: Stable volume identifier derived from the filename without extension.
          example: frus1969-76v01
        filename:
          type: string
          description: Original XML filename in the HistoryAtState/frus repository.
          example: frus1969-76v01.xml
        subseries:
          type: string
          description: Subseries identifier derived from the filename.
          example: "1969-76"
        title:
          type: string
          description: Full volume title from the TEI header.
        dateRange:
          $ref: "#/components/schemas/DateRange"
        publicationDate:
          type: string
          nullable: true
          description: ISO 8601 publication year or date; null if absent from the TEI header.
          example: "2003"
        status:
          type: string
          enum:
            - published
            - partiallyPublished
            - planned
          description: Publication status of the volume.
        editors:
          type: array
          items:
            type: string
          description: Named editors (excluding the general editor).
        generalEditor:
          type: string
          nullable: true
          description: General series editor, if named in the TEI header.
        documentCount:
          type: integer
          description: Approximate number of documents; may be 0 if not available from the header.
        sizeBytes:
          type: integer
          description: File size in bytes as reported by the GitHub API.
        tags:
          type: array
          items:
            type: string
          description: |
            Volume-level subject tag slugs from the TEI teiHeader
            (`keywords[@scheme="https://history.state.gov/tags"]`).
            Empty array is valid for volumes predating the tagging system.
          example:
            - kissinger-henry-a
            - iran
            - arms-control-and-disarmament

    DocumentBrowserEntry:
      type: object
      description: |
        Lightweight metadata for a single FRUS document, used by the Browser's
        Compilation/Chapter level. Sourced from the `document_cache` SQLite table
        populated by `IndexingPipeline`. Does not include document body content.

        Added in Session 11 (Browser View — Compilation/Chapter level).
      required:
        - documentId
        - volumeId
        - header
      properties:
        documentId:
          type: string
          description: The `xml:id` value of the `<div type="document">` element, e.g. `d1`
        volumeId:
          type: string
          description: Volume this document belongs to, e.g. `frus1969-76v01`
        documentNumber:
          type: string
          nullable: true
          description: Printed document number extracted from the `<head>`, if present, e.g. `"42"`
        header:
          type: string
          description: Document heading or title line
        dateline:
          type: string
          nullable: true
          description: Dateline string, if present
        sourceNote:
          type: string
          nullable: true
          description: Archival provenance note, if present

    DocumentRenderModel:
      type: object
      description: |
        The fully-rendered representation of a single FRUS document, structured for
        direct consumption by the Document view. Mirrors the `FRUSDocumentRenderModel`
        Swift type produced by `ASTToRenderNodeConverter`.
        Schema detail deferred — structure defined by Session 06 Swift types.
      required:
        - documentId
        - bodyNodes
        - footnotes
      properties:
        documentId:
          type: string
          description: The document identifier matching the `xml:id` attribute.
        bodyNodes:
          type: array
          description: Main content render nodes in document order.
          items:
            type: object
        footnotes:
          type: array
          description: Footnote body nodes in sequential display order.
          items:
            type: object

    PageRangeRecord:
      type: object
      description: |
        A single page-break record extracted from a volume's TEI XML during indexing.
        Used by the Citation Lookup engine (Session 30) to resolve page number
        references to specific documents and sections.
        Schema and population logic defined in Session 31 task file.
      required:
        - volumeId
        - documentId
        - pageNumber
        - pageNumberType
      properties:
        volumeId:
          type: string
          description: Volume this page break belongs to.
        documentId:
          type: string
          description: Document within the volume containing this page break.
        sectionId:
          type: string
          nullable: true
          description: Section or compilation grouping within the document, if applicable.
        pageNumber:
          type: string
          description: Raw `@n` attribute value from the `<pb>` element.
        pageNumberType:
          type: string
          enum:
            - arabic
            - roman
            - prefixed
            - unparseable
          description: Normalised page number type derived from the `@n` value.

    SearchResult:
      type: object
      description: |
        A single ranked full-text search result returned by `GET /search`.
        Results are ordered by BM25 relevance score (lower = more relevant).
        The `snippet` field contains the matching context with `<b>…</b>` delimiters
        around the first matching run, suitable for display in search result lists.

        Added by Session 09 (Search Index Pipeline).
      required:
        - documentId
        - volumeId
        - header
        - snippet
        - bm25Score
        - subjectTagIds
        - userTagIds
      properties:
        documentId:
          type: string
          description: Document identifier (e.g. `d1`), unique within its volume.
        volumeId:
          type: string
          description: Volume this document belongs to (e.g. `frus1969-76v01`).
        documentNumber:
          type: string
          nullable: true
          description: Printed document number, if present.
        header:
          type: string
          description: Document header / title line.
        dateline:
          type: string
          nullable: true
          description: Dateline string (place and date of authorship).
        sourceNote:
          type: string
          nullable: true
          description: Source note describing archival provenance.
        snippet:
          type: string
          description: Context snippet with matching terms wrapped in `<b>…</b>`.
        bm25Score:
          type: number
          format: double
          description: BM25 relevance score. Lower (more negative) means more relevant.
        subjectTagIds:
          type: array
          items:
            type: string
          description: Subject tag IDs associated with this document.
        userTagIds:
          type: array
          items:
            type: string
          description: User tag IDs associated with this document.
