servers:
  - url: https://api.history.state.gov/v1
    description: |
      Future production endpoint (not yet deployed). Described here as a
      roadmap specification. The current app uses GitHub's raw CDN and local
      SQLite in place of this server.

security:
  - ApiKeyAuth: []

tags:
  - name: Volumes
    description: Volume manifest, download, and page range data
  - name: Documents
    description: Document browse and retrieval
  - name: Persons
    description: |
      Volume-level persons list extracted from front-matter `<listPerson>` sections.
      Used by `PersonMentionStore` and `ASTToRenderNodeConverter` to resolve
      `<persName>` references to structured `PersonEntry` values. Added in Session 40.
  - name: Glossaries
    description: |
      Volume-level terms and abbreviations extracted from front-matter
      `<div type="terms">` sections. Used to resolve `<gloss>` references.
      Added alongside Persons in Session 40–41.
  - name: Subjects
    description: Subject tag taxonomy and document appearances
  - name: CrossReferences
    description: Directed document cross-reference graph data
  - name: SourceNotes
    description: |
      Structured archival provenance extracted from document source notes.
      `SourceNoteParser` (Sessions 23, 130) classifies each note into typed
      cases (lot file, RG number, presidential library, CIA, etc.).
      `SourcesParserDelegate` (Session 130) extracts the volume-level sources
      list during indexing.
  - name: Highlights
    description: |
      User-created text highlights with flat-text character offsets and color tags.
      `DocumentHighlight` SwiftData model introduced in Session 102; highlights
      rendered via the CSS Custom Highlight API (Sessions 143–145).
  - name: Search
    description: Full-text search across indexed FRUS documents
  - name: CorpusAnalysis
    description: |
      Corpus-scale vocabulary and distribution statistics computed over the
      published corpus rather than over the volumes a client happens to hold.
      Added in v0.4.0 for the Query & Corpus Analysis wave (PRs #582–#634),
      whose local implementations are bounded by the downloaded library and by
      the size of the bundled reference artifacts.
  - name: RelatedDocuments
    description: |
      Document-to-document relationships that require an all-pairs pass over the
      whole corpus: lexical neighbours and reprints. `RelatedDocumentsEngine`
      ranks candidates on device, but its candidate universe is the two
      generators (archival provenance and editorial cross-references) — nothing
      local says "these two documents are about the same thing". Added in
      v0.4.0 after the on-device lexical-neighbour index was withdrawn.
  - name: CitationLookup
    description: Page-number-to-document resolution (Session 30)

paths:

  /volumes:
    get:
      summary: List all FRUS volumes
      description: |
        Returns the paginated manifest of all FRUS volumes: every published,
        partially published, and planned volume with its full metadata.

        **Current implementation:** Data is bundled in `manifest.json` (generated
        by `ManifestGenerator` from TEI headers in the HistoryAtState GitHub
        repository) and served from `ManifestStore`. Introduced in Session 02.
      operationId: listVolumes
      tags:
        - Volumes
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema:
            type: string
            enum: [published, partiallyPublished, planned]
          description: Filter by publication status. Omit to return all statuses.
        - name: subseries
          in: query
          schema:
            type: string
          description: |
            Filter to volumes in a specific subseries (e.g. `1969-76`). Subseries
            identifiers are derived from the filename prefix.
      responses:
        "200":
          description: Paginated list of volume manifest entries
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeManifestList"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}:
    get:
      summary: Retrieve metadata for a single FRUS volume
      description: |
        Returns full metadata for one FRUS volume by its stable identifier.

        **Current implementation:** Metadata is looked up by `volumeId` in the
        in-memory manifest array held by `ManifestStore`. No separate per-volume
        endpoint exists in the app — the full manifest is always fetched. This
        endpoint would allow the app to refresh a single volume's metadata without
        re-fetching the entire manifest. Introduced as a spec endpoint in Session 28.
      operationId: getVolume
      tags:
        - Volumes
      parameters:
        - $ref: "#/components/parameters/VolumeId"
      responses:
        "200":
          description: Volume manifest entry
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeManifestEntry"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}/download:
    get:
      summary: Download a FRUS volume XML file
      description: |
        Returns the full TEI XML for a single FRUS volume.

        **Current implementation:** `DownloadManager` constructs the URL as
        `https://raw.githubusercontent.com/HistoryAtState/frus/master/volumes/{filename}`
        and fetches it with `URLSession`. Introduced in Session 05.

        A purpose-built FRUS API would serve this endpoint with HTTP range support
        (via `Accept-Ranges` / `Range` headers) for resumable downloads and
        `Content-Encoding: gzip` for compressed transfer.
      operationId: downloadVolume
      tags:
        - Volumes
      parameters:
        - $ref: "#/components/parameters/VolumeId"
      responses:
        "200":
          description: Full TEI XML content of the volume
          headers:
            Content-Length:
              schema:
                type: integer
              description: File size in bytes.
            ETag:
              schema:
                type: string
              description: SHA-256 of the XML content, for cache validation.
            Accept-Ranges:
              schema:
                type: string
                example: bytes
              description: Indicates range request support for resumable downloads.
          content:
            application/xml:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}/documents:
    get:
      summary: List document metadata for a volume
      description: |
        Returns paginated lightweight metadata for every document in a volume,
        in source order (matching the order of `<div type="document">` elements
        in the TEI XML).

        **Current implementation:** Served from the local SQLite `document_cache`
        table populated by `IndexingPipeline`. The volume must be downloaded and
        indexed before this endpoint is meaningful. Introduced in Session 11.
      operationId: listDocuments
      tags:
        - Documents
      parameters:
        - $ref: "#/components/parameters/VolumeId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Ordered, paginated list of document metadata entries
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentBrowserEntryList"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}/documents/{documentId}:
    get:
      summary: Retrieve a single FRUS document
      description: |
        Returns the fully-rendered representation of one FRUS document as a
        structured JSON object ready for display by the Document view.

        **Current implementation:** No document-level API call exists. The full
        volume XML is read from local storage and `FRUSDocumentParser` (Session 06)
        uses early-abort SAX parsing to extract the target `<div type="document">`
        fragment. `ASTToRenderNodeConverter` (Session 06) then converts the AST
        to a `FRUSDocumentRenderModel` for rendering.

        A purpose-built API would serve pre-parsed render models, eliminating the
        full-XML download requirement.
      operationId: getDocument
      tags:
        - Documents
      parameters:
        - $ref: "#/components/parameters/VolumeId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Parsed document as a structured render model
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRenderModel"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}/documents/{documentId}/cross-references:
    get:
      summary: Cross-reference graph for a document
      description: |
        Returns the ego graph centred on one FRUS document: all inbound edges
        (other documents that reference this one) and outbound edges (documents
        this one references), plus display metadata for every reachable node.

        **Current implementation:** `CrossReferenceStore` (Session 17) queries the
        `cross_references` SQLite table, populated by `IndexingPipeline` from
        `<ref>` elements inside footnote and editorial-note blocks. The graph is
        built in memory and rendered by `CrossReferenceGraphView` (Session 18)
        using a force-directed layout.

        A `downloadedOnly` flag restricts the response to nodes whose volumes the
        client has already downloaded, mirroring the `downloadedVolumeIds` filter
        applied locally by `CrossReferenceStore`.
      operationId: getDocumentCrossReferences
      tags:
        - CrossReferences
      parameters:
        - $ref: "#/components/parameters/VolumeId"
        - $ref: "#/components/parameters/DocumentId"
        - name: downloadedOnly
          in: query
          schema:
            type: boolean
            default: false
          description: |
            When `true`, excludes nodes whose source volumes are not in the
            caller-supplied `knownVolumeIds` list. Use to replicate the
            client-side `downloadedVolumeIds` filter.
        - name: knownVolumeIds
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: |
            Volume IDs the client has already downloaded; used with `downloadedOnly`
            to filter the response to locally-resolvable nodes only.
      responses:
        "200":
          description: Cross-reference ego graph for the document
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossReferenceGraph"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}/page-ranges:
    get:
      summary: Page range table for a volume
      description: |
        Returns all page-break records extracted from the volume's TEI XML
        during indexing. Used by the Citation Lookup feature (Session 30) to
        resolve citations of the form "FRUS 1969–76 Vol. I, p. 47" to specific
        documents.

        **Current implementation:** Populated by `IndexingPipeline` from
        `<pb>` elements in the TEI XML. Schema and storage logic will be
        defined in Session 30. Endpoint specified here as a placeholder.
      operationId: getVolumePageRanges
      tags:
        - Volumes
        - CitationLookup
      parameters:
        - $ref: "#/components/parameters/VolumeId"
      responses:
        "200":
          description: Array of page-range records for the volume
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageRangeRecord"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}/persons:
    get:
      summary: Persons list for a volume
      description: |
        Returns all persons recorded in the volume's front-matter `<listPerson>`
        or `<div type="persons">` section, each with a stable `ref` identifier,
        a display name, and an optional biographical description.

        **Current implementation:** Extracted by `PersonsParserDelegate` (Sessions 40–41)
        during volume indexing and stored in the `persons` SQLite table. Available at
        runtime via `PersonMentionStore.allPersons(forVolumeId:)`. The volume must be
        fully downloaded and indexed for this data to be available.

        `ASTToRenderNodeConverter` uses these records to resolve `<persName ref="…">`
        elements to `PersonEntry` objects embedded in `persNameLink` render nodes,
        enabling the Person Detail sheet. Serving this endpoint server-side would
        eliminate the need to download the full XML just to resolve person name links.

        **Session history:** Session 40 introduced `PersonMentionStore` and SQLite
        persistence. Session 41 implemented the SQLite-first lookup with XML fallback.
        Session 149 added user-facing feedback when the lookup returns nil.
      operationId: getVolumePersons
      tags:
        - Persons
      parameters:
        - $ref: "#/components/parameters/VolumeId"
      responses:
        "200":
          description: Array of person entries for the volume
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonEntry"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}/terms:
    get:
      summary: Terms and abbreviations glossary for a volume
      description: |
        Returns all entries in the volume's front-matter terms/abbreviations
        glossary (`<div type="terms">`), each with a stable `ref` identifier,
        a term string, and an optional definition.

        **Current implementation:** Extracted by `TermsParserDelegate` (Session 40–41)
        during indexing and stored in the `terms` SQLite table. Available at runtime
        via `PersonMentionStore.allTerms(forVolumeId:)`. Used by
        `ASTToRenderNodeConverter` to resolve `<gloss target="…">` elements to
        `GlossEntry` objects in `glossLink` render nodes.

        Serving this server-side would eliminate the full XML download requirement
        for glossary resolution.
      operationId: getVolumeTerms
      tags:
        - Glossaries
      parameters:
        - $ref: "#/components/parameters/VolumeId"
      responses:
        "200":
          description: Array of gloss entries for the volume
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GlossEntry"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}/documents/{documentId}/html:
    get:
      summary: Pre-rendered HTML for a document
      description: |
        Returns the document body as a self-contained HTML fragment, ready for
        direct display in a `WKWebView` without client-side XML parsing or AST
        conversion.

        **Current implementation:** The app performs the full pipeline on-device:
        (1) download 5–30 MB TEI XML, (2) `FRUSDocumentParser` SAX parse,
        (3) `ASTToRenderNodeConverter` build `FRUSDocumentRenderModel`,
        (4) `FRUSRenderNodeHTMLSerializer` produce HTML fragment,
        (5) `HTMLTemplate.build` wrap in full `<!DOCTYPE html>` document with
        CSS variables. All of these steps run locally. Sessions 140–147 (WebKit
        Rendering Migration) introduced the serializer and template; the
        `FRUSDocumentWebView` now loads the result into a `WKWebView`.

        A purpose-built API serving pre-rendered HTML would eliminate steps 1–4
        entirely. The client supplies its preferred `textSize` and `colorScheme`
        query parameters so the server can inject the correct CSS variables.

        The response is the complete `<!DOCTYPE html>` string ready for
        `WKWebView.loadHTMLString(_:baseURL:)`.

        **Offset stability:** Each `<button data-skip="1">` footnote marker and
        `<aside popover data-skip="1">` footnote body carry the `data-skip`
        attribute defined in Session 143 (`frus-offset-engine.js`). The flat-text
        character offsets stored in `DocumentHighlight.startOffset`/`endOffset`
        are stable across server re-renders as long as the TEI source and
        `ASTToRenderNodeConverter.version` constant are unchanged.
      operationId: getDocumentHtml
      tags:
        - Documents
      parameters:
        - $ref: "#/components/parameters/VolumeId"
        - $ref: "#/components/parameters/DocumentId"
        - name: textSize
          in: query
          schema:
            type: string
            enum: [small, medium, large, extraLarge]
            default: medium
          description: |
            Body text size preference. Maps to `TextSizePreference` body font
            sizes: small=12px, medium=14px, large=16px, extraLarge=19px.
        - name: colorScheme
          in: query
          schema:
            type: string
            enum: [light, dark]
            default: light
          description: |
            Color scheme for injected CSS variables. The server injects the
            appropriate `--color-primary`, `--color-background`, etc. values
            matching the `FRUSTheme.cssVariables` output.
      responses:
        "200":
          description: Complete HTML document string
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            ETag:
              schema:
                type: string
              description: |
                Identifies the specific TEI source + converter version combination
                used to render this HTML. Matches the `renderingVersion` field on
                `DocumentHighlight` records created from this render.
          content:
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}/source-notes:
    get:
      summary: Structured source note provenance for all documents in a volume
      description: |
        Returns structured archival provenance for every document in a volume
        that carries a source note, parsed into typed cases by `SourceNoteParser`.

        **Current implementation:** `SourcesParserDelegate` (Session 130) extracts
        the volume-level sources list from the front matter during indexing and
        writes it to `document_sources` and `volume_sources` SQLite tables.
        `SourceNoteParser` (Sessions 23, 130, 150) classifies individual notes.
        `SourceExplorerView` uses these to present NARA Catalog lookups, CIA CREST
        links, and period-specific finding-aid URLs.

        Serving this server-side would make source note resolution available
        without requiring the volume to be downloaded or indexed.

        **Provenance types:** Each item's `provenanceType` field maps to a
        `ParsedSourceNote` enum case in `SourceNoteParser.swift`:

        | `provenanceType` | Description |
        |------------------|-------------|
        | `lotFile` | State Dept. lot file (RG 59/84) — lot number + optional series |
        | `naraCollection` | NARA record group with series info — RG + series + lot |
        | `centralFiles` | State Dept. central files (decimal or subject-numeric) |
        | `cfpfFile` | Central Foreign Policy Files 1973–1979 (P/D/N reels, AAD telegrams) |
        | `presidentialLibrary` | Presidential library folder |
        | `ciaCollection` | CIA record — job number + box |
        | `namedFileSeries` | Named office-file series or manuscript collection cited without a lot number or repository (`IO Files`, `Roosevelt Papers`) — series name is the match key |
        | `foreignGovernmentArchive` | Foreign archive |
        | `previouslyPublished` | Citation to a published work |
        | `unrecognized` | Could not be parsed |
      operationId: getVolumeSourceNotes
      tags:
        - SourceNotes
      parameters:
        - $ref: "#/components/parameters/VolumeId"
      responses:
        "200":
          description: Array of structured source note records, one per document that has a source note
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StructuredSourceNote"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

