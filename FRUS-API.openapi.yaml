  # GET /volumes/{volumeId}/persons/{ref}/documents
  # Returns documents within a specific volume that mention the given person ref.
  # Backed by PersonMentionStore.documents(forPersonRef:) filtered by volumeId.
  # Full implementation in Session 40/41 when person glossary endpoints are added.

  /search:
    get:
      summary: Full-text search across indexed FRUS documents
      description: |
        Executes a BM25-ranked full-text search across all indexed FRUS volumes.
        Supports keyword queries, phrase search, prefix wildcard, boolean NOT,
        volume-scoped filtering, and optional date-range filtering. (Subject-tag
        filtering was retired in Session 09; the parameter survives, inert, for
        persistence stability.)

        Results are ordered by BM25 relevance (lower score = more relevant).

        **Current implementation:** `SearchService` (Session 09) queries the
        FTS5 virtual table inside `FTS5Store` and hydrates results from the
        `document_cache` table. The `SearchViewModel` (Session 16) drives the
        `SearchView` UI. Search runs entirely on-device against the local SQLite
        database.
      operationId: searchDocuments
      tags:
        - Search
      parameters:
        - name: keywords
          in: query
          schema:
            type: string
          description: |
            Space-separated keywords combined via boolean AND (default) or OR.
            Maps to the `keywords` field of `SearchQuery` in `SearchModels.swift`.
        - name: phrase
          in: query
          schema:
            type: string
          description: Exact phrase that must appear in order.
        - name: booleanMode
          in: query
          schema:
            type: string
            enum: [and, or]
            default: and
          description: How multiple keywords are combined.
        - name: excludedTerms
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Terms that must NOT appear in matching documents.
        - name: prefixWildcard
          in: query
          schema:
            type: string
          description: |
            Prefix for a wildcard search (e.g. `negoti` matches `negotiate`,
            `negotiated`). Maps to the `prefixWildcard` field of `SearchQuery`.
        - name: dateRangeEarliest
          in: query
          schema:
            type: string
            format: date
          description: Only return documents on or after this ISO 8601 date.
        - name: dateRangeLatest
          in: query
          schema:
            type: string
            format: date
          description: Only return documents on or before this ISO 8601 date.
        - name: subjectTagIds
          in: query
          deprecated: true
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: |
            **Inert since Session 09** (document-level subject tags retired).
            Retained for persistence stability — `SavedSearch`/`Project`
            snapshots round-trip the value losslessly, but it no longer
            constrains results.
        - name: volumeIds
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: |
            Restrict results to these volume IDs. Omit to search all indexed volumes.
        - name: includeSummaries
          in: query
          schema:
            type: boolean
            default: true
          description: Whether to search AI-generated summary text.
        - name: includeNotes
          in: query
          schema:
            type: boolean
            default: true
          description: Whether to search user research note text.
        - name: documentType
          in: query
          required: false
          schema:
            type: string
            enum: [all, documentsOnly, editorialNotesOnly]
            default: all
          description: >
            Filter results by document type. `all` returns all indexed content (default).
            `documentsOnly` excludes editorial notes. `editorialNotesOnly` returns only
            editorial notes. Added in Session 38.
        - name: personRef
          in: query
          required: false
          schema:
            type: string
          description: >
            If provided, restrict results to documents mentioning this person ref
            (the `ref` attribute value from `<persName ref="...">` elements, e.g. `"p_kissinger"`).
            Applied as a post-processing filter after FTS5 matching. Added in Session 39.
        - name: facets
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [years, volumes, people, documentType, provenance]
          style: form
          explode: true
          description: |
            Facet sections to compute over the **whole match** and return in the
            `facets` property of the response. Omit for no facets.

            **Current implementation:** `ResultSetFacets` (R-1a) aggregates these
            five sections in SQL over the local match, deliberately not over the
            fetched page and not over the checklist-filtered subset — decision
            R-1-2, "otherwise the denominator shifts under the researcher as they
            triage". Two limits are the reason to want them served: the counts
            describe the whole local match while the result list is separately
            capped at 1,000 (iOS) / 7,500 (macOS), and the match itself covers
            only downloaded volumes.

            Every bucket in a requested section is returned, sorted descending by
            count; a server that must bound a section says so in `bounds` rather
            than truncating silently. #586 asks for facet rows to be reorderable
            so a researcher can reach the slice they want (facet rows are already
            tappable to narrow, `FacetPanelView.swift:445`); serving complete
            buckets is what makes an alternative ordering a display decision
            rather than a second query.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated ranked search results
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultList"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /citation-lookup:
    get:
      summary: Resolve a FRUS citation to matching documents
      description: |
        Accepts structured citation fields and returns a ranked list of
        `CitationMatch` results. Strategies are attempted in priority order:
        exact document number, page range, superimposed document number,
        fuzzy document number, title fragment disambiguation, and manifest-only
        (volume not downloaded).

        **Current implementation:** `CitationMatchingEngine` (Session 30) resolves
        citations entirely on-device using the local FTS5 index and `page_ranges`
        SQLite table. A future FRUS API could serve this endpoint to enable
        citation resolution without downloading volumes.

        For undownloaded volumes the response includes `requiresDownload: true`
        and a populated `volumeManifestEntry` for display before the user confirms
        a download.
      operationId: lookupCitation
      tags:
        - CitationLookup
      parameters:
        - name: subseries
          in: query
          schema:
            type: string
          description: |
            Chronological subseries identifier, e.g. `"1969-76"`.
            Hyphens and en dashes are treated interchangeably.
        - name: volumeNumber
          in: query
          schema:
            type: string
          description: |
            Volume number string, e.g. `"I"`, `"XIV"`, `"1"`.
            Arabic and Roman numeral forms are normalized before matching.
        - name: documentNumber
          in: query
          schema:
            type: integer
          description: Printed document number to resolve.
        - name: pageNumber
          in: query
          schema:
            type: integer
          description: Page number for page-range–based resolution.
        - name: titleFragment
          in: query
          schema:
            type: string
          description: |
            Partial volume title text used to disambiguate when a volume number
            matches multiple volumes in the same subseries.
      responses:
        "200":
          description: Ranked list of citation matches (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitationMatch"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  # ── Corpus analysis (v0.4.0) ───────────────────────────────────────────────
  # Statistics over the published corpus rather than over a client's downloaded
  # library. See "Capabilities Priced Out On Device" in the info description.

  /corpus/vocabulary:
    get:
      summary: Corpus vocabulary, with the words behind each index term
      description: |
        Returns index vocabulary entries, each carrying **both** key spaces: the
        Porter stem an FTS5-style index stores, the surface forms actually
        attested in the corpus, and the lemmas the same text produces under
        `NLTagger`. Browsable by prefix and rankable by document frequency or
        occurrences.

        **Current implementation:** `FTS5Connection` creates a persistent
        `fts5vocab('…','row')` companion, `frus_documents_vocab`, at store open
        (Q-3). The shipped API over it is point lookup only —
        `FTS5Vocabulary.vocabularyEntry(stem:)` behind `indexStem(of:)`. There is
        no ranked query and no prefix scan, because an `fts5vocab` row table has
        no index behind `doc` or `cnt`: ranking 274,927 stems is a full scan that
        does not warm up. `WHERE term >= ? AND term < ?` is the only cheap local
        access path, which is what D-1b would ship.

        **What the client cannot do locally, at any cost.** An index term is a
        stem, and a stem is not a word. `QueryInspectorView` warns the researcher
        that their query was stemmed, and D-1a fills that warning by running the
        bundled keyness baseline's `allTerms` keys back through the tokenizer —
        an approximation of the index derived from the app's English lexicon, so
        the copy is required to say "words with this root **include**…" and to
        fall back to a count when the stem is uncovered. A publisher-side
        vocabulary is derived from the corpus, so it can say *are*.

        The two spaces are not interchangeable and the mismatch is measured:
        `alliance` (15,937), `security` (177,061), `defense` (141,745) and
        `treaty` (204,741) are present as lemmas while the stems `allianc`,
        `secur`, `defens` and `treati` are all absent — which is why
        `BundledKeynessBaseline` refuses to unify the two term lists on record.
        `surfaceForms` plus `lemmas` on one entry is the join the client cannot
        make for itself.
      operationId: getCorpusVocabulary
      tags:
        - CorpusAnalysis
      parameters:
        - name: prefix
          in: query
          required: false
          schema:
            type: string
          description: |
            Return only entries whose stem begins with this prefix. Case-folded.
        - name: stem
          in: query
          required: false
          schema:
            type: string
          description: |
            Return the single entry for this exact index term. Mutually exclusive
            with `prefix` and `word`.
        - name: word
          in: query
          required: false
          schema:
            type: string
          description: |
            Return the entry for whichever index term this word stems to. The
            server applies the same stemmer that built the index, which is the
            point: the client's Swift `PorterStemmer` and SQLite's are separate
            implementations, and Porter is not idempotent, so a client-side
            round-trip can name a term the index never wrote.
        - name: orderBy
          in: query
          required: false
          schema:
            type: string
            enum: [documentFrequency, occurrences, term]
            default: documentFrequency
          description: Ranking applied before pagination.
        - name: minimumDocumentFrequency
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: |
            Drop entries appearing in fewer than this many documents. A frequency
            ranking with no floor returns function words: the corpus's own top
            stems are `the of to and in that a be on for it is state with by as
            thi not s i`, and the app's stopword list cannot filter them because
            it is lemma-shaped.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated vocabulary entries.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyEntryList"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /corpus/term-statistics:
    post:
      summary: Corpus reference counts for a term list, untruncated
      description: |
        Returns corpus occurrence and document-frequency counts for the supplied
        terms under the caller's own tokenisation, together with the lens's true
        total token count. This is the **reference side** of every keyness
        measure in the app; the scope side stays local when the client wants it
        to, which makes this the smallest possible substitution for the bundled
        artifact.

        `POST` rather than `GET` because the term list is the request: a
        collocation ranking counts its own tokens and truncates nothing, so the
        list routinely runs to thousands of terms. The operation is read-only and
        has no side effects.

        **Current implementation:** `BundledKeynessBaseline` reads
        `keyness-baseline.json`, produced by `CloudVectorsGenerator` (S-1 part 2).
        It ships ~1 MB inside a 12.32 MB bundled-JSON footprint, and three of its
        properties are what this endpoint exists to remove:

        1. **It is a head, not a vocabulary.** The top 20,000 terms per lens are
           retained; the cut is a frequency rather than a rank, extended through
           the whole tied band, and each lens reports its `cutoffCount` so a
           caller can say "occurs fewer than N times corpus-wide" instead of
           confusing *unpriced* with *absent*. Measured on the shipped artifact
           the `allTerms` head cuts at 110 and prices 98.1% of token mass;
           `topics` cuts at 65. The remaining 2% is where a period term lives.
           `Keyness.score` turns a missing key into a real zero — which its own
           documentation calls "a word unique to the scope" — so an unpriced term
           floats to the *top* of a ranking unless the UI intervenes, and both
           `WordCloudView` and `CollocationView` carry ranking and copy whose
           only job is that intervention.
        2. **It is pinned to one tokenisation.** The artifact records the tuning,
           the diplomatic-stopword flag and the SHA-256 of both payloads it was
           built under. The app's tokenizer follows live user settings, and
           `excludeBoilerplate` is one tap away in the word cloud's own overflow
           menu — so a legitimate settings change yields
           `.unavailable(.configurationMismatch)` and keyness disappears rather
           than reporting a wrong number. A server counts under whatever
           tokenisation the caller states, so the measure stays available.
        3. **It is expensive to refresh.** A full `CloudVectorsGenerator` run over
           552 volumes is 50–60 minutes, so the reference is only as current as
           the last build shipped to the App Store.

        The three entity lenses (`people`, `places`, `organizations`) are
        unpriced by the generator because `WordCloudMultiLensTokenizer` refuses
        them; a server may price them, and reports `pricedLenses` so a client can
        offer only what it can score.
      operationId: getCorpusTermStatistics
      tags:
        - CorpusAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermStatisticsRequest"
      responses:
        "200":
          description: Corpus counts for the requested terms.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermStatisticsResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /analysis/term-ranking:
    post:
      summary: What a scope is about, by frequency or by keyness
      description: |
        Ranks the vocabulary of an arbitrary scope — the corpus, a subseries, a
        volume list, a date range, a query's whole match, or an explicit document
        list — either by raw frequency or by keyness against the corpus.

        **Current implementation:** the word cloud. `WordCloudScopeResolver`
        resolves the scope, `WordCloudMultiLensTokenizer` counts it in one
        `NLTagger` pass, and `KeynessCloud` re-ranks against
        `BundledKeynessBaseline` for the "Distinctive" mode (S-1 part 3). With no
        volumes downloaded the cloud still renders, from `cloud-vectors-core.json`
        and `cloud-vectors-volumes.json`.

        Three limits are structural, and all three are properties of shipping the
        answer in the bundle rather than computing it:

        - **Top 50 per scope.** The bundled vectors keep 50 terms per scope per
          lens. Aggregation happens before truncation, so subseries totals are
          right, but nothing below the cut can ever be shown.
        - **5,000 documents per date range.** `WordCloudScopeResolver` caps a
          date-range scope at `dateRangeKeyLimit = 5000` documents, taken
          **ascending**, so a "1950s" cloud can describe 1950–51 and label itself
          1950–59. This is the surface that best answers "what words did people
          use for this, then", and it is quietly date-biased.
        - **Thin scopes are marked, not hidden.** A scope with too little text is
          returned flagged `belowSignalThreshold` rather than silently replaced by
          a wider one (decision O-4-2): a fallback would show the era's vocabulary
          and let the researcher attribute it to the volume. Responses here keep
          that contract.

        A document-key scope is how a **working corpus** (M-1) is analysed. The
        client sends `documentKeys` in the `"volumeId/documentId"` form
        `WorkingCorpus.documentKeys` already stores, and gets a ranking over the
        researcher's own set — including its documents in volumes that are not
        downloaded, which is exactly the part the device cannot do.
      operationId: rankScopeTerms
      tags:
        - CorpusAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermRankingRequest"
      responses:
        "200":
          description: Ranked terms for the scope, with the bounds that applied.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermRankingResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /analysis/collocates:
    post:
      summary: What appears near a query, ranked by how distinctive that company is
      description: |
        Collects the words within ±N of every match of a query across a scope and
        ranks them against the corpus reference — the inverse of a proximity
        search, and the question `NEAR` cannot answer.

        **Current implementation:** `SearchService.collocation` (S-2 part 1) scans
        `document_cache.body_text` in chunks of 400 documents, fans the per-
        document scan out across a task group, and ranks through
        `CollocationAnalysis.rank`. It is careful, measured work, and it is bounded
        in three places at once:

        - **The match budget.** `collocationTokenBudget = 200_000` surviving
          window tokens, about 2.5 s of tagging at the measured 80,124 tokens/sec.
          The bound is on matches rather than bytes because the `NLTagger` pass is
          the cost: a dense query over a full macOS result set is 6.4 s of tagging
          against 4.2 s of everything else.
        - **The set it can even see.** It takes the *retained* result set — 1,000
          results on iOS, 7,500 on macOS — not the whole match, and the whole match
          covers only downloaded volumes.
        - **200 matches per document.** `CollocationWindow.maxAnchorsPerDocument`,
          with the dropped count reported as `omittedAnchorCount` rather than
          absorbed.

        The plan's own scope note is explicit that the corpus is out of reach:
        "a few thousand documents × ~10 KB of body text is tens of MB of scanning
        — fine on-device; the whole corpus is not."

        **Contract preserved from the local implementation.** `documentsScanned`
        and `documentsOffered` are separate fields for a reason: conflating them
        made a complete scan report itself as truncated whenever a document was
        missing from the cache. `bounded` is keyed on what the scan was *offered*,
        never on what had text. A collocate the reference cannot price is returned
        with `unpriced: true`, because a naive sort by effect size otherwise
        returns the unpriced tail and nothing else, every row advertising a
        multiple that the same row's label calls an upper bound.
      operationId: getCollocates
      tags:
        - CorpusAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollocationRequest"
      responses:
        "200":
          description: Ranked collocates, with the scan's coverage stated.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollocationResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /analysis/term-distribution:
    get:
      summary: A term's distribution over time, volumes or subseries
      description: |
        Returns a term's distribution across periods or corpus divisions, in
        documents or occurrences, with the corpus denominator for each bucket so
        a share can be computed without a second call, and with dispersion
        alongside frequency.

        **Current implementation:** `CorpusAnalyticsService.termFrequencyByYear` /
        `documentTotalsByYear` behind `AnalyticsView`, normalised per CA-4 and
        extended by R-2 (PR-C dispersion, PR-D occurrences).

        **Why occurrences are the expensive half.** R-2 PR-D measured the real
        6.3 GB index: 274,927 distinct stems, 234,155,358 postings, 316,839
        documents. An instance-mode `fts5vocab` companion attaches in 6 ms and
        scans at 7–8M postings/s, but joining it to `document_cache` in SQL costs
        8.99 s for `govern` and 12.91 s for `state`, because cost tracks document
        count rather than postings — ~300k random rowid lookups into a table whose
        rows average 5.7 KB. The shipped design reads the posting list and buckets
        in Swift instead, 40–90× faster; the ceiling a researcher can type by
        accident is `the` at 2.03 s returning 314,609 rows, and the plan records
        that the iPhone case was never measured.

        **Why some shapes have no local answer at all.** `OccurrenceAvailability`
        classifies the query before counting, and its unavailable cases are
        properties of a stemmed FTS5 index: an exact-word query cannot be counted
        from stems at any cost; prefix, phrase and `NEAR` match several index
        terms and instance mode is per-term; a boolean has no single honest total.
        The app deliberately shows documents and states the reason rather than
        printing a number that means something different per shape.

        A publisher-side index need not inherit all of those. A server holding a
        positional index — and, if it chooses, an unstemmed one, which the app
        ruled out rather than double its own index size — can count phrase and
        proximity occurrences honestly. The response therefore carries its own
        `occurrenceAvailability` object instead of assuming the client's rules,
        and a composite query still resolves to per-operand series rather than one
        meaningless total.

        **Dispersion is not decoration.** Measured in the same pass: Article 43
        occurrences rise 1948→1949 (77→92) while its documents fall (34→11),
        because one document, `frus1949v01/d102`, carries 54 of the 92. "Article 43
        collapsing" is a document-count claim, and the occurrence data says the
        topic concentrated rather than faded.
      operationId: getTermDistribution
      tags:
        - CorpusAnalysis
      parameters:
        - name: term
          in: query
          required: true
          schema:
            type: string
          description: |
            The term or query to plot, in the same inline syntax `/search`
            accepts. A composite query yields one series per positive operand.
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [year, decade, volume, subseries, administration]
            default: year
          description: |
            Bucketing. `administration` keys documents to who was in office on the
            document's own date, matching the offline
            `AdministrationProfilesIndexGenerator` attribution (coverage, not
            production; Nixon and Ford distinct; the two Cleveland and Trump terms
            separate).
        - name: measure
          in: query
          required: false
          schema:
            type: string
            enum: [documents, occurrences, dispersion]
            default: documents
          description: |
            `documents` counts matching documents; `occurrences` counts instances;
            `dispersion` reports both plus occurrences-per-document, the statistic
            `InspectedOperand.corpusOccurrencesPerDocument` defines locally and the
            Query Inspector renders above its 1.5 display threshold (#579; the
            uncalled `FTS5Vocabulary` copy of the definition was deleted in W-16).
        - name: volumeIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: |
            Restrict to these volumes. Omit for the whole corpus — which is the
            default the local implementation cannot offer, since its corpus is
            whatever has been downloaded.
        - name: documentType
          in: query
          required: false
          schema:
            type: string
            enum: [all, documentsOnly, editorialNotesOnly]
            default: all
          description: |
            Applied identically to numerator and denominator. The local
            normalisation is trustworthy precisely because
            `termFrequencyByYear` and `documentTotalsByYear` apply byte-identical
            rules over key spaces that coincide by construction; a server that
            filtered one side only would reintroduce the shares above 100% CA-4
            fixed.
        - name: undatedPolicy
          in: query
          required: false
          schema:
            type: string
            enum: [volumeStartYear, separateBucket, exclude]
            default: volumeStartYear
          description: |
            How documents with no date are bucketed. `volumeStartYear` mirrors the
            app's fallback, applied to **both** sides — the mirror-image bug is an
            undated document's occurrences vanishing while its document remains.
            `separateBucket` returns them in `undatedCount` instead, which is what
            a person-mention numerator needs, since that numerator is dated-only
            and borrowing a fallback-bearing denominator makes its shares too
            small.
      responses:
        "200":
          description: One or more series, with corpus denominators per bucket.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermDistributionResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /search/concordance:
    get:
      summary: Keyword-in-context lines across a whole match
      description: |
        Returns one line per **occurrence** — left context, the matched text as it
        appears, right context — across the whole match rather than a page of it,
        sortable on the columns a concordance is read down.

        **Current implementation:** `KWICBuilder` + `KWICLine` (R-3b part 1),
        surfaced on both search surfaces by R-3b part 2.
        `SearchService.concordance` takes **the displayed page** and says why:
        passing the whole retained set "would fetch body text for up to 7,500
        documents — 37 MB on macOS, for a view showing twenty lines", and
        `SearchResult` deliberately carries no `bodyText` because 1,000 (iOS) or
        7,500 (macOS) retained results each holding a body is a permanent memory
        cost paid by every search for a mode most searches never open. R-3a's
        two-phase fetch — rank narrow, hydrate the window — is the same economy
        applied to the result list.

        So the local concordance is honest about what it covers, and what it
        covers is a page. Served by the publisher, the same view describes the
        match.

        **One defect disappears with it.** Local alignment re-derives stems with
        the Swift `PorterStemmer` while the match came from SQLite's, so a matched
        document can produce no aligned occurrence at all; the shipped result
        counts them in `documentsWithoutLines` rather than dropping them silently.
        A server that matched and aligned with one tokenizer has no such
        divergence — but the field is kept in the response, required, so a client
        cannot tell the two situations apart by accident.

        `sortBy: leftContext` orders on the left context **reversed by
        character**, which groups lines by the word immediately before the match.
        That is where a formula announces itself, and it is the sort that turns a
        list of hits into the observation that a phrase is boilerplate in one
        bureau and argument in another.
      operationId: getConcordance
      tags:
        - Search
      parameters:
        - name: keywords
          in: query
          required: false
          schema:
            type: string
          description: Same query semantics as `GET /search`.
        - name: phrase
          in: query
          required: false
          schema:
            type: string
          description: Exact phrase that must appear in order.
        - name: booleanMode
          in: query
          required: false
          schema:
            type: string
            enum: [and, or]
            default: and
          description: How multiple keywords are combined.
        - name: prefixWildcard
          in: query
          required: false
          schema:
            type: string
          description: Prefix for a wildcard search.
        - name: volumeIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Restrict to these volumes. Omit for the whole corpus.
        - name: dateRangeEarliest
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Only concordance documents on or after this ISO 8601 date.
        - name: dateRangeLatest
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Only concordance documents on or before this ISO 8601 date.
        - name: documentKeys
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: |
            Concordance exactly these documents, in `"volumeId/documentId"` form —
            a working corpus (M-1), or a collection. Mutually exclusive with the
            query parameters above.
        - name: contextCharacters
          in: query
          required: false
          schema:
            type: integer
            minimum: 20
            maximum: 400
            default: 60
          description: |
            Characters either side of the match. Matches the local `radius`
            default of 60.
        - name: maxLinesPerDocument
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 200
          description: |
            Per-document bound. Occurrences beyond it are counted in
            `omittedCount`, never silently dropped.
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [document, date, leftContext, rightContext]
            default: document
          description: |
            Concordance ordering. `leftContext` sorts on the reversed left
            context; `rightContext` on the right context as written.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated concordance lines, one per occurrence.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConcordanceLineList"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}/documents/{documentId}/similar:
    get:
      summary: Documents about the same thing, corpus-wide
      description: |
        Returns the documents most lexically similar to this one across the whole
        corpus, with the shared vocabulary that produced each match.

        **This endpoint exists because the on-device version was withdrawn.** The
        assessment (v2.0, 2026-08-01) rejected the bundled lexical-neighbour index
        on two grounds, and only the first is about size:

        - **Size.** A conventional top-10-neighbours-per-document index over
          ~314k documents is ~40–45 MB of JSON, far outside the house
          `Data(contentsOf:) + JSONDecoder` pattern; the thresholded strong-pairs
          alternative measured 3.9–4.6 MB at 120k pairs against a ≤3.5 MB bar. The
          all-pairs similarity pass itself is a corpus-scale computation the app
          has no way to run.
        - **Coverage, which is fatal and which size cannot fix.** Every local
          related-documents path drops a candidate with no `document_cache` row —
          `RelatedDocumentsEngine.rank` guards on exactly that — and the design
          reserved ≥80% of neighbours for cross-volume pairs. At a 40-volume
          library that retains roughly 30% of a document's neighbours, i.e. 7.5–13%
          effective coverage, below the plan's own 15% floor **by construction**.
          For contrast, measured on the live index: 61.7% of documents have an
          archival-provenance companion inside their own volume and 71.7% of
          cross-reference edges are intra-volume, so both shipped axes degrade
          gracefully to a one-volume library where a cross-volume lexical axis
          degrades catastrophically.

        A publisher-side endpoint inverts both objections: the computation happens
        once where the whole corpus already is, and a neighbour in a volume the
        researcher has never downloaded is returned as a citation they can act on.

        **Do not consume this as a sixth similarity axis without weighting care.**
        `RelatedDocumentsEngine` normalises each axis by its own maximum, so an
        axis returning a single candidate hands it 1.0; at the proposed default
        weight of 0.7 that outranks a genuine single-citation cross-reference
        partner (0.173) by 4×. Whatever the served coverage, the client should
        rank served neighbours against each other, not against a locally-derived
        maximum.
      operationId: getSimilarDocuments
      tags:
        - RelatedDocuments
      parameters:
        - $ref: "#/components/parameters/VolumeId"
        - $ref: "#/components/parameters/DocumentId"
        - name: minimumScore
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
            default: 0.4
          description: |
            Cosine-similarity floor. The assessment's measurement pass used
            τ ∈ {0.30, 0.40, 0.50, 0.60}.
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [corpus, crossVolume, sameVolume]
            default: corpus
          description: |
            `crossVolume` excludes neighbours inside the anchor's own volume —
            the pairs no local axis can find. `sameVolume` is the cheap case the
            device can already approximate.
        - name: includeSharedTerms
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: |
            Whether to return the terms that produced each match. They are the
            only way a researcher can check a similarity claim, and a similarity
            score with nothing behind it is not evidence.
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Neighbours, most similar first. May be empty.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarDocumentList"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

  /volumes/{volumeId}/documents/{documentId}/reprints:
    get:
      summary: Where else this document is printed in FRUS
      description: |
        Returns other printings of the same document elsewhere in the series —
        "also printed as Document 412 in *Foreign Relations*, 1952–1954, vol.
        VIII" — with a formatted citation for each.

        **The one piece of the lexical-neighbour assessment that survived it.**
        The v1.0 design treated near-identical pairs (score ≥95) as noise to be
        filtered out of a topical-similarity index; the v2.0 revision concluded
        they are the better feature. FRUS genuinely reprints documents, precision
        is ~1.0, the result is verifiable by eye, and — the decisive property —
        it is *most* useful when the other volume is **not** downloaded, because
        the citation itself is the deliverable.

        It is deliberately a separate endpoint rather than a filter on `/similar`:
        the assessment's recommendation is that reprints render as a document-view
        affordance and never as a similarity axis, so they never touch the
        per-axis normalisation defect and add no weight slider to a UI that
        already iterates `SimilarityAxis.allCases` unconditionally.

        `citation` is pre-formatted in the style `CitationFormatter` produces, so
        a client can display and export a reprint reference for a volume it has
        never downloaded and cannot format from local metadata.
      operationId: getDocumentReprints
      tags:
        - RelatedDocuments
      parameters:
        - $ref: "#/components/parameters/VolumeId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Other printings of this document. Usually empty.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReprintMatch"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500ServerError"

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key issued by the Office of the Historian. In FRUS Explorer the key
        is stored in iCloud Keychain via `KeychainStore` (Session 05) under a
        shared access group, allowing it to sync across the user's devices.
        Keys are entered in the NARA API Key panel within the Settings screen.

  parameters:
    VolumeId:
      name: volumeId
      in: path
      required: true
      schema:
        type: string
      description: |
        Stable volume identifier derived from the XML filename without extension.
        Example: `frus1969-76v01`

    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
      description: |
        Document identifier matching the `xml:id` attribute on the
        `<div type="document">` element. Example: `d1`

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Maximum number of items to return in a single page.

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of items to skip before the first returned item.

  headers:
    X-RateLimit-Limit:
      schema:
        type: integer
      description: Maximum requests allowed in the current rate-limit window.
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: Requests remaining in the current rate-limit window.
    X-RateLimit-Reset:
      schema:
        type: integer
      description: Unix timestamp (seconds) when the current window resets.

  responses:
    400BadRequest:
      description: The request was malformed or contained invalid parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_QUERY
            message: "Search query must contain at least one searchable term."
            detail: null

    401Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHORIZED
            message: "A valid X-API-Key header is required."
            detail: null

    404NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: "Volume 'frus1999-00v00' was not found."
            detail: null

    429TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: RATE_LIMITED
            message: "Rate limit exceeded. Retry after 47 seconds."
            detail: null

    500ServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL_ERROR
            message: "An unexpected error occurred. Please try again later."
            detail: null

  schemas:

    # ── Shared ───────────────────────────────────────────────────────────────

    Error:
      type: object
      description: |
        Standard error response body returned for all 4xx and 5xx responses.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code in SCREAMING_SNAKE_CASE.
          example: VOLUME_NOT_FOUND
        message:
          type: string
          description: Human-readable description of the error.
          example: "Volume 'frus1969-76v99' was not found."
        detail:
          type:
            - string
            - "null"
          description: |
            Optional supplementary detail (e.g. a field name or constraint
            that was violated). Null when no additional context is available.

    DateRange:
      type: object
      description: Inclusive date range covered by a volume or document set.
      properties:
        earliest:
          type:
            - string
            - "null"
          format: date
          description: ISO 8601 date of the earliest document in the range.
        latest:
          type:
            - string
            - "null"
          format: date
          description: ISO 8601 date of the latest document in the range.

    # ── Pagination wrappers ───────────────────────────────────────────────────

    VolumeManifestList:
      type: object
      description: Paginated response wrapping a list of volume manifest entries.
      required:
        - total
        - items
      properties:
        total:
          type: integer
          description: Exact total count of volumes matching the filter parameters.
        items:
          type: array
          items:
            $ref: "#/components/schemas/VolumeManifestEntry"

    DocumentBrowserEntryList:
      type: object
      description: Paginated response wrapping a list of document metadata entries.
      required:
        - total
        - items
      properties:
        total:
          type: integer
          description: Exact total number of documents in the volume.
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentBrowserEntry"

    SearchResultList:
      type: object
      description: |
        Paginated response wrapping ranked search results. The `total` field
        is an approximate count (BM25 match counting is non-trivial at scale).
      required:
        - total
        - items
      properties:
        total:
          type: integer
          description: Approximate total count of matching documents.
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        facets:
          $ref: "#/components/schemas/SearchFacets"
          description: |
            Present only when the `facets` query parameter was supplied. Computed
            over the whole match, never over this page.

    SubjectTagList:
      type: object
      deprecated: true
      description: |
        Paginated response wrapping subject tag entries. **Historical** — the
        document-level subject taxonomy was retired in Session 09 (see `/subjects`).
      required:
        - total
        - items
      properties:
        total:
          type: integer
          description: Total number of subject tags in the taxonomy.
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubjectTag"

    # ── Volumes ───────────────────────────────────────────────────────────────

    VolumeManifestEntry:
      type: object
      description: |
        Rich metadata for a single FRUS volume, generated from its TEI header.

        The `tags` field contains volume-level subject tag slugs extracted from
        `/TEI/teiHeader/profileDesc/textClass/keywords[@scheme="https://history.state.gov/tags"]/term`.
        These are authoritative OH-curated tags embedded in the published TEI.

        Corresponds to the `VolumeManifestEntry` Swift struct in
        `FRUSExplorer/Models/Manifest/ManifestModels.swift`. Introduced in Session 02.
      required:
        - volumeId
        - filename
        - subseries
        - title
        - dateRange
        - status
        - editors
        - documentCount
        - sizeBytes
        - tags
      properties:
        volumeId:
          type: string
          description: |
            Stable volume identifier derived from the filename without extension.
          example: frus1969-76v01
        filename:
          type: string
          description: XML filename in the HistoryAtState/frus repository.
          example: frus1969-76v01.xml
        subseries:
          type: string
          description: Subseries identifier derived from the filename prefix.
          example: "1969-76"
        title:
          type: string
          description: Full volume title from the TEI header.
        dateRange:
          $ref: "#/components/schemas/DateRange"
        publicationDate:
          type:
            - string
            - "null"
          description: ISO 8601 publication year or date; null if absent.
          example: "2003"
        status:
          type: string
          enum:
            - published
            - partiallyPublished
            - planned
          description: Publication status of the volume.
        editors:
          type: array
          items:
            type: string
          description: Named editors (excluding the general editor).
        generalEditor:
          type:
            - string
            - "null"
          description: General series editor, if named in the TEI header.
        documentCount:
          type: integer
          description: |
            Approximate number of documents. May be 0 for volumes predating
            the `documentCount` field in the manifest generator.
        sizeBytes:
          type: integer
          description: File size in bytes as reported by the GitHub API.
        tags:
          type: array
          items:
            type: string
          description: |
            Volume-level subject tag slugs from the TEI teiHeader. Empty array
            is valid for volumes predating the tagging system.
          example:
            - kissinger-henry-a
            - iran
            - arms-control-and-disarmament

    # ── Documents ─────────────────────────────────────────────────────────────

    DocumentBrowserEntry:
      type: object
      description: |
        Lightweight metadata for a single FRUS document, used by the browser's
        compilation/chapter list. Does not include document body content.

        Corresponds to `DocumentBrowserEntry` in
        `FRUSExplorer/Browser/BrowserViewModel.swift`. Sourced from the
        `document_cache` SQLite table populated by `IndexingPipeline`.
        Introduced in Session 11.
      required:
        - documentId
        - volumeId
        - header
      properties:
        documentId:
          type: string
          description: |
            The `xml:id` attribute on `<div type="document">`, e.g. `d1`.
        volumeId:
          type: string
          description: Volume this document belongs to, e.g. `frus1969-76v01`.
        documentNumber:
          type:
            - string
            - "null"
          description: Printed document number from the `<head>`, if present.
          example: "42"
        header:
          type: string
          description: Document heading or title line.
        dateline:
          type:
            - string
            - "null"
          description: Dateline string (place and date of authorship), if present.
        sourceNote:
          type:
            - string
            - "null"
          description: Archival provenance note, if present.
        dateISO:
          type:
            - string
            - "null"
          format: date
          description: |
            ISO 8601 date string (`yyyy-MM-dd`) extracted from TEI `<date @when>`
            attribute during indexing. Used for structured date-range filtering and
            date-based sort. Null when no parseable date was found. Added in
            Sessions 12–15 (date sort infrastructure).
          example: "1972-02-21"
        isEditorialNote:
          type: boolean
          description: |
            `true` when this entry is a FRUS editorial note rather than a
            primary-source document. Editorial notes carry contextual commentary
            inserted by editors. Introduced in Session 38 for the editorial-note
            filter in search and corpus browser.
          default: false

    DocumentRenderModel:
      type: object
      description: |
        The fully-rendered representation of a single FRUS document, structured
        for direct consumption by the Document view. Mirrors the
        `FRUSDocumentRenderModel` Swift type produced by
        `ASTToRenderNodeConverter` (Session 06).

        Body content is represented as a tree of `FRUSRenderNode` values.
        Footnote bodies are listed separately so the renderer can cross-reference
        marker and body positions.
      required:
        - documentId
        - volumeId
        - header
        - bodyNodes
        - footnotes
      properties:
        documentId:
          type: string
          description: The document identifier, e.g. `d1`.
        volumeId:
          type: string
          description: The volume this document belongs to.
        header:
          type: string
          description: Document heading extracted from `<head>`.
        dateline:
          type:
            - string
            - "null"
          description: Dateline string, if present.
        sourceNote:
          type:
            - string
            - "null"
          description: Archival source note, if present.
        bodyNodes:
          type: array
          description: Main content render nodes in document order.
          items:
            $ref: "#/components/schemas/FRUSRenderNode"
        footnotes:
          type: array
          description: Footnote body nodes in sequential display order.
          items:
            $ref: "#/components/schemas/FRUSRenderNode"

    FRUSRenderNode:
      type: object
      description: |
        A single node in the FRUS document render tree. Uses a `type` discriminator
        to represent the different content structures produced by
        `ASTToRenderNodeConverter` (Session 06).

        The full set of node types mirrors the `FRUSRenderNode` Swift enum in
        `FRUSExplorer/TEI/FRUSRenderNode.swift`. Complex recursive structures
        (paragraph, heading, blockquote, list) carry a `children` array of
        nested `FRUSRenderNode` objects.
      required:
        - type
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          description: Node type discriminator.
          enum:
            - heading
            - dateline
            - letterOpener
            - letterCloser
            - salutation
            - paragraph
            - footnoteBody
            - plainText
            - boldText
            - italicText
            - smallCapsText
            - underlineText
            - termText
            - footnoteMarker
            - persNameLink
            - glossLink
            - crossRefLink
            - pageBreak
            - tableBlock
            - listBlock
            - editorialNoteBlock
            - figureBlock
            - suppliedText
            - sicText
            - corrText
            - formulaText
            - lineBreak
            - unknown
        text:
          type: string
          description: Present on leaf text nodes (`plainText`, `formulaText`).
        children:
          type: array
          description: |
            Child nodes for container types (paragraph, heading, boldText, etc.).
          items:
            $ref: "#/components/schemas/FRUSRenderNode"
        id:
          type:
            - string
            - "null"
          description: |
            Footnote ID for `footnoteBody` and `footnoteMarker` nodes.
        number:
          type: integer
          description: Footnote display number for `footnoteBody` and `footnoteMarker`.
        ref:
          type:
            - string
            - "null"
          description: |
            Target reference string for `persNameLink`, `glossLink`, and
            `crossRefLink` nodes.
        target:
          type: string
          description: Cross-reference target document ID for `crossRefLink` nodes.

    # ── Cross-References ──────────────────────────────────────────────────────

    CrossReferenceGraph:
      type: object
      description: |
        The ego graph centred on one FRUS document, containing all inbound and
        outbound cross-references and display metadata for every reachable node.

        Mirrors `CrossReferenceGraph` in
        `FRUSExplorer/CrossReference/CrossReferenceModels.swift`.
        Introduced in Session 17.
      required:
        - centralDocumentId
        - centralVolumeId
        - inboundEdges
        - outboundEdges
        - hasUndownloadedSources
        - nodeMetadata
      properties:
        centralDocumentId:
          type: string
          description: Document ID of the ego-graph centre.
        centralVolumeId:
          type: string
          description: Volume ID of the ego-graph centre.
        inboundEdges:
          type: array
          description: References whose target is the central document.
          items:
            $ref: "#/components/schemas/CrossReferenceEdge"
        outboundEdges:
          type: array
          description: References whose source is the central document.
          items:
            $ref: "#/components/schemas/CrossReferenceEdge"
        hasUndownloadedSources:
          type: boolean
          description: |
            `true` when at least one inbound edge has a source volume absent
            from the `knownVolumeIds` filter, indicating potentially incomplete
            inbound data.
        nodeMetadata:
          type: object
          description: |
            Display metadata keyed by `"volumeId/documentId"`. Includes the
            central document and every reachable node. Values may have null
            header/dateline for documents from volumes not in `document_cache`.
          additionalProperties:
            $ref: "#/components/schemas/CrossReferenceNodeMetadata"

    CrossReferenceEdge:
      type: object
      description: |
        A directed reference from one FRUS document to another, extracted from
        a `<ref>` element inside a footnote or editorial-note block during
        indexing. Mirrors `CrossReferenceEdge` in CrossReferenceModels.swift.
      required:
        - sourceDocumentId
        - sourceVolumeId
        - targetDocumentId
        - targetVolumeId
        - referenceType
      properties:
        sourceDocumentId:
          type: string
          description: Document ID of the citing document.
        sourceVolumeId:
          type: string
          description: Volume ID of the citing document.
        targetDocumentId:
          type: string
          description: Document ID of the cited document.
        targetVolumeId:
          type: string
          description: Volume ID of the cited document.
        context:
          type:
            - string
            - "null"
          description: |
            Surrounding footnote or editorial-note text captured at index time.
            Null for edges indexed before the `context` column was added.
        referenceType:
          $ref: "#/components/schemas/ReferenceType"

    CrossReferenceNodeMetadata:
      type: object
      description: |
        Display-ready metadata for one node (document) in the cross-reference
        graph. Fields are null for documents whose volumes have not been indexed.
        Mirrors `CrossReferenceNodeMetadata` in CrossReferenceModels.swift.
      required:
        - documentId
        - volumeId
      properties:
        documentId:
          type: string
          description: Document identifier within its volume.
        volumeId:
          type: string
          description: Volume the document belongs to.
        documentNumber:
          type:
            - string
            - "null"
          description: Printed document number, if known.
        header:
          type:
            - string
            - "null"
          description: Document header/title, or null if the volume is not indexed.
        dateline:
          type:
            - string
            - "null"
          description: Dateline string, or null if the volume is not indexed.
        dateISO:
          type:
            - string
            - "null"
          description: |
            ISO-8601 document date from `document_dates.date_iso` (`yyyy-MM-dd`,
            possibly truncated to `yyyy-MM` or `yyyy`). Null for unindexed or
            undated documents. Added in Session 161 for the timeline layout and
            node date labels.
        summary:
          type:
            - string
            - "null"
          description: |
            On-device generated summary from `document_cache.summary_text`, when
            the user has summarized this document. Added in Session 161 so the
            graph's node info panel can preview a document without opening it.

    ReferenceType:
      type: string
      description: |
        Whether a cross-reference was extracted from a footnote or an editorial
        note block. Mirrors `ReferenceType` in CrossReferenceModels.swift.
      enum:
        - footnote
        - editorialNote

    # ── Subjects ──────────────────────────────────────────────────────────────

    SubjectTag:
      type: object
      deprecated: true
      description: |
        A single entry in the retired document-level FRUS subject taxonomy.

        **Historical** — mirrored the `SubjectTag`/`SubjectTagEntry` Swift types
        (introduced Session 08, removed with the taxonomy in Session 09; the
        volume-level `VolumeLevelTag` system is unrelated and remains live).
      required:
        - subjectId
        - displayName
        - category
      properties:
        subjectId:
          type: string
          description: |
            Stable slug, sharing the namespace with `VolumeManifestEntry.tags`.
          example: kissinger-henry-a
        displayName:
          type: string
          description: Human-readable tag name for display in the UI.
          example: Kissinger, Henry A.
        category:
          type: string
          enum:
            - people
            - places
            - topics
          description: |
            Top-level taxonomy category. Maps to `TagCategory` in
            TaxonomyModels.swift.

    SubjectAppearance:
      type: object
      deprecated: true
      description: |
        A record linking a subject tag to a specific document, with a confidence
        tier reflecting how the association was assigned.

        **Historical** — mirrored the `SubjectAppearance` Swift type consumed by
        `SubjectTagStore` (introduced Session 08, removed with the document-level
        taxonomy in Session 09).
      required:
        - subjectId
        - documentId
        - volumeId
        - confidence
      properties:
        subjectId:
          type: string
          description: Subject tag identifier.
        documentId:
          type: string
          description: Document carrying the tag.
        volumeId:
          type: string
          description: Volume the document belongs to.
        confidence:
          $ref: "#/components/schemas/SubjectTagConfidence"

    SubjectTagConfidence:
      type: string
      deprecated: true
      description: |
        Confidence tier for a document-level subject tag assignment.

        - `curated`: Manually verified by OH staff or the data pipeline operator.
        - `stringMatch`: Derived algorithmically via string matching. May include
          false positives.

        **Historical** — mirrored the `SubjectTagConfidence` Swift type
        (introduced Session 08, removed with the document-level taxonomy in
        Session 09).
      enum:
        - curated
        - stringMatch

    # ── Search ────────────────────────────────────────────────────────────────

    SearchResult:
      type: object
      description: |
        A single ranked full-text search result. Results are ordered by BM25
        relevance score (lower = more relevant). The `snippet` field contains
        the matching context with `<b>…</b>` delimiters around the first
        matching run, suitable for display in result lists.

        Mirrors `SearchResult` in `FRUSExplorer/Search/SearchModels.swift`.
        Introduced in Session 09.
      required:
        - documentId
        - volumeId
        - header
        - snippet
        - bm25Score
        - subjectTagIds
        - userTagIds
      properties:
        documentId:
          type: string
          description: Document identifier, unique within its volume.
        volumeId:
          type: string
          description: Volume this document belongs to.
        documentNumber:
          type:
            - string
            - "null"
          description: Printed document number, if present.
        header:
          type: string
          description: Document header / title line.
        dateline:
          type:
            - string
            - "null"
          description: Dateline string.
        sourceNote:
          type:
            - string
            - "null"
          description: Archival source note.
        snippet:
          type: string
          description: Context snippet with matching terms wrapped in `<b>…</b>`.
        bm25Score:
          type: number
          format: double
          description: BM25 relevance score. Lower (more negative) = more relevant.
        subjectTagIds:
          type: array
          items:
            type: string
          description: |
            Subject tag IDs associated with this document. **Inert since
            Session 09** — new/re-indexed documents carry none; only databases
            indexed before the retirement still surface values here.
        userTagIds:
          type: array
          items:
            type: string
          description: User tag IDs from research notes linked to this document.
        isEditorialNote:
          type: boolean
          description: >
            True if this entry is a FRUS editorial note rather than a primary-source
            document. Editorial notes carry contextual commentary inserted by editors
            rather than original diplomatic correspondence. Added in Session 38.
          default: false
        dateISO:
          type:
            - string
            - "null"
          format: date
          description: |
            ISO 8601 date string extracted from TEI `<date @when>` during indexing.
            Used to enable date-based sort of search results. Added in Sessions 12–15.
          example: "1969-01-20"

    # ── Citation Lookup ───────────────────────────────────────────────────────

    PageRangeRecord:
      type: object
      description: |
        A single page-break record extracted from a volume's TEI XML during
        indexing. Used by the Citation Lookup engine (Session 30) to resolve
        page number references to specific documents and sections.

        Storage logic and full schema detail will be finalized in Session 30.
        Endpoint defined here as a forward specification.
      required:
        - volumeId
        - documentId
        - pageNumber
        - pageNumberType
      properties:
        volumeId:
          type: string
          description: Volume this page break belongs to.
        documentId:
          type: string
          description: Document containing this page break.
        sectionId:
          type:
            - string
            - "null"
          description: Section or compilation grouping, if applicable.
        pageNumber:
          type: string
          description: Raw `@n` attribute value from the `<pb>` element.
        pageNumberType:
          type: string
          enum:
            - arabic
            - roman
            - prefixed
            - unparseable
          description: Normalised page number type derived from the `@n` value.

    # ── Persons and Glossaries (Sessions 40–41) ──────────────────────────────

    PersonEntry:
      type: object
      description: |
        A single entry from the volume's List of Persons front-matter section.
        Extracted from `<listPerson>` or `<div type="persons">` by
        `PersonsParserDelegate` during indexing.

        The `ref` value matches the `xml:id` attribute on the `<persName>` element
        in the front-matter list (e.g. `"p_HK1"`). It is used as a key in
        `ASTToRenderNodeConverter.personLookup` to resolve `<persName ref="#p_HK1">`
        inline references to this full entry.

        Mirrors `PersonEntry` in `FRUSExplorer/TEI/FRUSASTNode.swift`.
      required:
        - ref
        - name
      properties:
        ref:
          type: string
          description: |
            Bare `xml:id` value without leading `#`, e.g. `"p_HK1"`.
          example: p_HK1
        name:
          type: string
          description: Full display name.
          example: "Kissinger, Henry A."
        description:
          type:
            - string
            - "null"
          description: Brief biographical note, if present in the TEI source.

    GlossEntry:
      type: object
      description: |
        A single entry from the volume's terms and abbreviations glossary,
        extracted from `<div type="terms">` by `TermsParserDelegate`.

        The `ref` value matches the `xml:id` attribute (e.g. `"t_NSC1"`).
        Used by `ASTToRenderNodeConverter.glossLookup` to resolve
        `<gloss target="#t_NSC1">` inline references.

        Mirrors `GlossEntry` in `FRUSExplorer/TEI/FRUSASTNode.swift`.
      required:
        - ref
        - term
      properties:
        ref:
          type: string
          description: Bare `xml:id` value without leading `#`.
          example: t_NSC1
        term:
          type: string
          description: The abbreviated term or acronym.
          example: NSC
        definition:
          type:
            - string
            - "null"
          description: Full expansion or definition, if present.
          example: "National Security Council"

    # ── Source Notes (Sessions 23, 130, 150) ─────────────────────────────────

    StructuredSourceNote:
      type: object
      description: |
        Structured archival provenance for a single document, parsed from its
        source note by `SourceNoteParser`.

        `provenanceType` is a discriminator corresponding to `ParsedSourceNote`
        enum cases in `SourceNoteParser.swift`. The typed sub-fields (lotNumber,
        recordGroup, library, collection, jobNumber, fileIdentifier) are populated
        according to the case; unused fields are null.

        Introduced in Session 23; extended in Session 130 with `.naraCollection`
        and `.ciaCollection` cases; Session 150 added date-based routing for
        decimal-file citations; Session 151 added `.cfpfFile` (Central Foreign
        Policy Files 1973–1979); Source Explorer Phase 1 (2026-07-03) added the
        `classification` field (sentence 2 of the source note when it is
        classification markings); Source Explorer Phase 2 (2026-07-03) added
        `.namedFileSeries` (named office-file series and manuscript collections
        cited without a lot number or repository — the `series` field carries the
        series name, which is the match key the collection-authority work
        resolves; no repository is asserted at parse time). The indexed
        `document_sources` row additionally stores `lot_file_norm`, a canonical
        compact uppercase lot key (`"64D199"`) derived from `lotNumber` for
        exact-match archival-neighbor keying; it is a derived normalization of
        `lotNumber`, not a separate field of this schema. Source Explorer
        Phase 3 (2026-07-03) likewise added the derived `decimal_class` column:
        the canonical decimal / subject-numeric class location
        (`"POL 27 ARAB-ISR"`, `"788.5"` — whitespace collapsed, Unicode dashes
        mapped to the ASCII hyphen) extracted from the citation sentence of
        central-files-shaped notes for class-leaf archival-neighbor matching;
        also a derived normalization, not a field of this schema.
      required:
        - documentId
        - volumeId
        - rawText
        - provenanceType
      properties:
        documentId:
          type: string
          description: Document this source note belongs to.
        volumeId:
          type: string
          description: Volume the document belongs to.
        rawText:
          type: string
          description: The plain-text source note as it appears in the TEI document.
        provenanceType:
          type: string
          enum:
            - lotFile
            - naraCollection
            - centralFiles
            - cfpfFile
            - presidentialLibrary
            - ciaCollection
            - namedFileSeries
            - foreignGovernmentArchive
            - previouslyPublished
            - unrecognized
          description: Classified provenance type.
        recordGroup:
          type:
            - string
            - "null"
          description: NARA record group number (e.g. `"59"`, `"218"`). Present for `naraCollection`, `lotFile`, and `centralFiles`.
        lotNumber:
          type:
            - string
            - "null"
          description: State Dept. lot file number (e.g. `"63D135"`). Present for `lotFile` and `naraCollection`.
        series:
          type:
            - string
            - "null"
          description: Series name within the record group, if extracted. For `namedFileSeries`, the cited series/collection name itself (e.g. `"IO Files"`, `"Roosevelt Papers"`).
        fileIdentifier:
          type:
            - string
            - "null"
          description: Decimal file number, subject-numeric code, or other file identifier.
        library:
          type:
            - string
            - "null"
          description: Presidential library name (e.g. `"Kennedy Library"`). Present for `presidentialLibrary`.
        collection:
          type:
            - string
            - "null"
          description: Collection name within the library. Present for `presidentialLibrary`.
        jobNumber:
          type:
            - string
            - "null"
          description: CIA accession job number (e.g. `"80B01285A"`). Present for `ciaCollection`.
        box:
          type:
            - string
            - "null"
          description: Box number within the series or collection.
        classification:
          type:
            - string
            - "null"
          description: |
            Classification markings from the second sentence of the source note,
            per the frus-sources sentence model (sentence 1 = archival citation,
            sentence 2 = markings, remainder = remarks). A short semicolon-separated
            marking string, e.g. `"Secret; Nodis"` or `"Top Secret; Sensitive;
            Exclusively Eyes Only"`. Null when the second sentence does not match
            the classification-marking vocabulary (the extractor stores null rather
            than junk). Added in Source Explorer Phase 1 (2026-07-03); stored in
            the `document_sources.classification` column.
          example: "Secret; Nodis"

    # ── Document Highlights (Sessions 102–145) ───────────────────────────────

    DocumentHighlight:
      type: object
      description: |
        A user-created text highlight within a FRUS document, stored using flat-text
        Unicode-scalar character offsets.

        Offsets are computed by the same DFS traversal over `FRUSDocumentRenderModel.bodyNodes`
        that produces `window.FRUSOffsets.flatText` in the browser (Sessions 102, 143).
        They are stable across app versions as long as the TEI source and
        `ASTToRenderNodeConverter.version` constant are unchanged.

        Currently stored in SwiftData + CloudKit as `DocumentHighlight` in
        `FRUSExplorer/Models/DocumentHighlight.swift`. The CSS Custom Highlight API
        renders them in the `FRUSDocumentWebView` (Sessions 143–145).

        An API that stores highlights server-side would enable cross-device highlight
        sync via a public endpoint rather than CloudKit, making highlights accessible
        to web and third-party clients.
      required:
        - id
        - documentId
        - volumeId
        - startOffset
        - endOffset
        - colorTag
        - renderingVersion
      properties:
        id:
          type: string
          format: uuid
          description: Stable highlight identifier.
        documentId:
          type: string
          description: Document the highlight belongs to.
        volumeId:
          type: string
          description: Volume the document belongs to.
        startOffset:
          type: integer
          description: |
            Inclusive start of the highlighted range in the flat-text offset space
            (Unicode scalar position, 0-based).
        endOffset:
          type: integer
          description: |
            Exclusive end of the highlighted range (Unicode scalar position).
        colorTag:
          type: string
          enum: [yellow, green, blue, pink]
          description: Highlight colour. Rendered via `::highlight(frus-{colorTag})` CSS rules.
        selectedText:
          type:
            - string
            - "null"
          description: |
            The verbatim text the user selected when creating the highlight.
            Stored for display in the Research window without re-parsing the document.
            Added in Session 131.
        renderingVersion:
          type: string
          description: |
            16-character hex prefix of SHA-256(flatText ++ converterVersion).
            When this does not match the current document render version, the
            highlight is considered stale and rendered in amber.
        createdAt:
          type:
            - string
            - "null"
          format: date-time
          description: ISO 8601 timestamp when the highlight was created.

    CitationMatch:
      type: object
      description: |
        A single candidate match from the citation lookup engine.
        Returned by `GET /citation-lookup`.
      required:
        - documentId
        - volumeId
        - rank
        - matchStrategy
        - confidenceLabel
        - requiresDownload
      properties:
        documentId:
          type: string
          description: Document identifier. Empty string for manifest-only results.
        volumeId:
          type: string
          description: Volume identifier.
        rank:
          type: integer
          description: Result rank; 1 = most likely match.
        matchStrategy:
          type: string
          enum:
            - exactDocumentNumber
            - pageRange
            - superimposedDocumentNumber
            - fuzzyDocumentNumber
            - titleFragmentMatch
            - manifestOnly
            - bestGuess
          description: Strategy used to make the match.
        confidenceLabel:
          type: string
          description: Explicit human-readable match quality label shown in the UI.
        correctionNote:
          type:
            - string
            - "null"
          description: |
            Plain-language explanation when a correction or best-guess recovery
            was applied. Displayed below the result card.
        requiresDownload:
          type: boolean
          description: "`true` when the matched volume is not in the local corpus."
        volumeManifestEntry:
          $ref: "#/components/schemas/VolumeManifestEntry"
          description: "Populated for `requiresDownload: true` results."

    # ── Corpus analysis (v0.4.0) ─────────────────────────────────────────────

    WordCloudLens:
      type: string
      enum:
        - allTerms
        - concepts
        - topics
        - actions
        - descriptors
        - sentiment
        - people
        - places
        - organizations
      description: |
        Vocabulary lens, matching `WordCloudLens` in `WordCloudKit`. The first six
        are lexical; the last three are entity lenses, which
        `WordCloudMultiLensTokenizer` refuses and `CloudVectorsGenerator`
        therefore leaves unpriced. `allTerms` is the app's default and must be
        priced by any server offering keyness, because `WordCloudView`'s picker
        offers every case and a lens with no reference makes the measure silently
        unavailable on a lens the researcher can select.

    TokenizationOptions:
      type: object
      description: |
        The tokenisation a caller is counting under, so scope-side and
        reference-side counts are comparable.

        This object is why a served reference does not need the artifact's
        configuration pinning. `keyness-baseline.json` records the tuning and the
        SHA-256 of both bundled payloads it was built under, and
        `BundledKeynessBaseline` returns `.unavailable(.configurationMismatch)`
        rather than a wrong number when the live settings differ — asymmetrically,
        since a longer `minimumLength` only shrinks the scope and is allowed,
        while a shorter one or a `foldPlurals` flip admits terms the reference
        never counted. A server counts on request, so a legitimate settings change
        costs a recount rather than the whole measure.
      properties:
        minimumLength:
          type: integer
          minimum: 1
          default: 3
          description: Shortest term counted. `WordCloudTuning.minimumLength`.
        minimumCount:
          type: integer
          minimum: 1
          default: 1
          description: Smallest scope count retained. `WordCloudTuning.minimumCount`.
        foldPlurals:
          type: boolean
          default: true
          description: Whether plural forms fold into their singular.
        filterMarkings:
          type: boolean
          default: true
          description: |
            Whether classification and handling markings (`SECRET`, `NODIS`,
            `EYES ONLY`) are excluded.
        excludeBoilerplate:
          type: boolean
          default: true
          description: |
            Whether the diplomatic stopword layer is applied. This is the setting
            most likely to diverge in practice: it is one tap away in the word
            cloud's own overflow menu, and turning it off fills a scope with
            `department`, `telegram`, `washington` against a reference count of
            zero — which keyness would rank as the corpus's most distinctive
            vocabulary.

    AnalysisScope:
      type: object
      description: |
        The document set a statistic is computed over, mirroring `WordCloudScope`
        and `ResultSetScope` in the app. Exactly one selector is honoured, in the
        order `documentKeys`, `query`, `volumeIds`, `subseriesId`, `dateRange`,
        `corpus`.
      required:
        - type
      properties:
        type:
          type: string
          enum: [corpus, volumes, subseries, dateRange, query, documents]
          description: Which selector applies.
        volumeIds:
          type: array
          items:
            type: string
          description: "Volume identifiers, for `type: volumes`."
        subseriesId:
          type: string
          description: "Subseries identifier, for `type: subseries`."
        startDate:
          type: string
          format: date
          description: "Inclusive lower bound, for `type: dateRange`."
        endDate:
          type: string
          format: date
          description: "Inclusive upper bound, for `type: dateRange`."
        query:
          type: string
          description: |
            A query in the inline syntax `/search` accepts, for `type: query`. The
            scope is its **whole match**, which is the part a client cannot
            reproduce: its own result set is retained at 1,000 (iOS) or 7,500
            (macOS) rows.
        documentKeys:
          type: array
          items:
            type: string
          description: |
            Explicit `"volumeId/documentId"` keys, for `type: documents`. This is
            the shape `WorkingCorpus.documentKeys` and
            `SummarizationScope.savedSearch(documentKeys:)` already store, so a
            researcher's working corpus (M-1) can be analysed as it stands —
            including the documents in it whose volumes are not downloaded.
        documentType:
          type: string
          enum: [all, documentsOnly, editorialNotesOnly]
          default: all
          description: Whether editorial notes are included.

    VocabularyEntryList:
      type: object
      description: Paginated response wrapping corpus vocabulary entries.
      required:
        - total
        - items
      properties:
        total:
          type: integer
          description: Exact count of entries matching the filter.
        items:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyEntry"

    VocabularyEntry:
      type: object
      description: |
        One index term, with the words it stands for. `stem` and `lemmas` are
        deliberately both present: they are different key spaces, they disagree
        systematically, and no client can join them from what it holds.
      required:
        - stem
        - documentFrequency
        - occurrences
        - surfaceForms
      properties:
        stem:
          type: string
          description: |
            The index term, as a `porter unicode61` tokenizer produces it —
            what a stemmed full-text query actually matches on.
          example: allianc
        documentFrequency:
          type: integer
          description: |
            Documents containing the term. The `doc` column of an `fts5vocab`
            row-mode companion.
          example: 8160
        occurrences:
          type: integer
          description: |
            Total instances across the corpus. The `cnt` column. Instance-mode and
            row-mode counts agree exactly — verified across terms in the R-2 PR-D
            measurement pass — so either can check the other.
          example: 16253
        surfaceForms:
          type: array
          description: |
            The words actually printed in FRUS that produce this stem, most
            frequent first. This is the list D-1a can only approximate locally,
            because the local map is derived from the app's English lexicon rather
            than read out of the corpus and can under-report a variant.
          items:
            type: object
            required:
              - form
              - occurrences
            properties:
              form:
                type: string
                example: alliances
              occurrences:
                type: integer
                example: 4102
              documentFrequency:
                type: integer
        lemmas:
          type: array
          items:
            type: string
          description: |
            The `NLTagger` lemmas the same surface forms produce — the key space
            `keyness-baseline.json` uses. Non-trivial rather than cosmetic: the
            verb `contain` (55,794) and the noun `containment` (569) are separate
            lemma keys, while the single index stem `contain` covers both, so a
            client pairing a stem with one lemma's count gets a confident wrong
            denominator.
        isStopword:
          type: boolean
          description: |
            Whether the term is filtered by the published stopword layer. Useful
            because a frequency-ranked vocabulary is otherwise topped by function
            words the app's lemma-shaped stopword list cannot remove — 47% of the
            corpus's top stems do not match it.

    TermStatisticsRequest:
      type: object
      description: A term list to price against the corpus.
      required:
        - lens
        - terms
      properties:
        lens:
          $ref: "#/components/schemas/WordCloudLens"
        terms:
          type: array
          maxItems: 50000
          items:
            type: string
          description: |
            Terms to price, in the lens's own key space (lemmas for the lexical
            lenses). No cap below `maxItems`: a collocation ranking counts its own
            tokens and truncates nothing, so the list is routinely thousands long.
        tokenization:
          $ref: "#/components/schemas/TokenizationOptions"

    TermStatisticsResponse:
      type: object
      description: |
        Corpus counts for the requested terms, plus the denominator every keyness
        measure divides by.
      required:
        - lens
        - totalTokens
        - cutoffCount
        - terms
      properties:
        lens:
          $ref: "#/components/schemas/WordCloudLens"
        totalTokens:
          type: integer
          description: |
            The lens's **true** total token count across every term in the corpus,
            not the sum of the terms returned here. The distinction is the whole
            point of the field: a relative frequency divided by a truncated sum is
            inflated for every term, and inflated unevenly against the scope side.
          example: 71204118
        cutoffCount:
          type: integer
          description: |
            The smallest corpus count this response prices. `1` when every term is
            priced, which a server computing on request can guarantee. Retained so
            a client can keep one code path for "occurs fewer than N times
            corpus-wide (unpriced)" — the bundled artifact's `allTerms` cutoff is
            110 and its `topics` cutoff is 65.
        distinctTerms:
          type: integer
          description: |
            Distinct terms in the corpus for this lens, for a coverage line.
            Measured at 254,027 for `allTerms` on the shipped artifact, of which
            the bundled head prices 20,000.
        generated:
          type: string
          format: date-time
          description: |
            When the underlying counts were computed. Replaces the bundled
            artifact's `generated` stamp in provenance lines.
        terms:
          type: array
          items:
            $ref: "#/components/schemas/CorpusTermStatistic"

    CorpusTermStatistic:
      type: object
      description: One term's corpus counts.
      required:
        - term
        - occurrences
        - documentFrequency
      properties:
        term:
          type: string
        occurrences:
          type: integer
          description: Instances across the corpus.
        documentFrequency:
          type: integer
          description: Documents containing the term.

    TermRankingRequest:
      type: object
      description: A scope to rank, and how.
      required:
        - scope
        - lens
      properties:
        scope:
          $ref: "#/components/schemas/AnalysisScope"
        lens:
          $ref: "#/components/schemas/WordCloudLens"
        measure:
          type: string
          enum: [frequency, keyness]
          default: keyness
          description: |
            `frequency` ranks on raw scope counts — the word cloud's default mode.
            `keyness` ranks on log-likelihood against the corpus, the S-1 measure,
            which is the corpus-linguistics standard and comparable to published
            keyness figures.
        tokenization:
          $ref: "#/components/schemas/TokenizationOptions"
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: |
            Terms returned. No bundled equivalent exists above 50, which is where
            the shipped cloud vectors truncate.
        minimumScopeCount:
          type: integer
          minimum: 1
          default: 3
          description: |
            Floor on scope occurrences before a term can be ranked, so a term
            appearing twice cannot top a keyness list.

    TermRankingResponse:
      type: object
      description: |
        A scope's ranked vocabulary, with everything needed to state what the
        ranking covers.
      required:
        - measure
        - lens
        - documentsInScope
        - documentsCounted
        - scopeTokenCount
        - terms
      properties:
        measure:
          type: string
          enum: [frequency, keyness]
        lens:
          $ref: "#/components/schemas/WordCloudLens"
        scopeTitle:
          type: string
          description: |
            Human-readable name for the scope, in the form
            `WordCloudScope.dateRangeTitle` and its siblings produce.
        documentsInScope:
          type: integer
          description: Documents the scope resolves to.
        documentsCounted:
          type: integer
          description: |
            Documents whose text was counted. Equal to `documentsInScope` unless a
            bound applied — never smoothed over. The local date-range path caps at
            5,000 documents taken ascending, with no notice, so a "1950s" cloud
            can describe 1950–51 and label itself 1950–59.
        scopeTokenCount:
          type: integer
          description: |
            Surviving tokens in the scope — the denominator the relative
            frequencies divide by.
        referenceTotalTokens:
          type: integer
          description: Corpus total for the lens. Present when `measure` is `keyness`.
        cutoffCount:
          type: integer
          description: |
            Smallest priced corpus count. `1` when every term is priced.
        belowSignalThreshold:
          type: boolean
          description: |
            Whether the scope holds too little text for this lens to be
            meaningful. Reported rather than silently widened to a larger scope
            (decision O-4-2): a fallback would show the era's vocabulary and let
            the researcher attribute it to the volume.
        generated:
          type: string
          format: date-time
        terms:
          type: array
          items:
            $ref: "#/components/schemas/RankedTerm"

    RankedTerm:
      type: object
      description: |
        One term in a ranking, carrying both raw counts so a client can display
        the evidence beside the score. G² grows with the amount of text, so two
        scopes of different sizes are compared on `effectRatio`, not on
        `logLikelihood`.
      required:
        - term
        - scopeCount
        - unpriced
      properties:
        term:
          type: string
        scopeCount:
          type: integer
          description: Occurrences inside the scope.
        corpusCount:
          type: integer
          description: |
            Occurrences across the corpus. Present when `measure` is `keyness`.
        logLikelihood:
          type: number
          format: double
          description: |
            G², the strength of the evidence that the difference is real. The
            ranking key for `keyness`.
        effectRatio:
          type: number
          format: double
          description: |
            How much more often the term is used here than across the corpus, per
            word of text — the effect size, and the figure to compare across
            scopes.
        unpriced:
          type: boolean
          description: |
            Whether the reference could not price this term, making `effectRatio`
            an upper bound. Always `false` from a server that prices every term;
            required so a client that also reads the bundled artifact keeps one
            code path, and so a truncating server cannot pass for one that does
            not. A missing reference count must never be shown as a real zero:
            `Keyness.score` treats that as "a word unique to the scope", which
            floats an unpriced term to the top of the ranking.
        sentiment:
          type: string
          enum: [positive, negative, neutral]
          description: |
            Present for the `sentiment` lens, which colours its terms by valence.

    CollocationRequest:
      type: object
      description: A query whose neighbourhood is to be collected and ranked.
      required:
        - query
        - scope
      properties:
        query:
          type: string
          description: |
            The query whose matches anchor the windows, in the inline syntax
            `/search` accepts. For a `NEAR(a b, N)` query **both** operands anchor,
            so the collocates are of the pair — which is the right reading of
            "what appears near this query", and worth stating on screen.
        scope:
          $ref: "#/components/schemas/AnalysisScope"
        windowSize:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: |
            Words either side of each match. Shares its control vocabulary with
            the `NEAR` distance, because it is the same concept.
        tokenization:
          $ref: "#/components/schemas/TokenizationOptions"
        minimumCount:
          type: integer
          minimum: 1
          default: 3
          description: Floor a neighbour must clear to be ranked.
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 50

    CollocationResponse:
      type: object
      description: |
        Ranked collocates, with the scan's coverage stated in the same terms
        `CollocationResult` uses, so a client can reuse its existing copy.
      required:
        - windowSize
        - documentsInScope
        - documentsOffered
        - documentsScanned
        - anchorCount
        - omittedAnchorCount
        - windowTokenCount
        - bounded
        - collocates
      properties:
        windowSize:
          type: integer
        documentsInScope:
          type: integer
          description: Documents the scope resolves to.
        documentsOffered:
          type: integer
          description: |
            Documents the scan reached before any budget stopped it. Distinct from
            `documentsScanned` on purpose: conflating the two made a complete scan
            report itself as truncated whenever a document had no cached text.
        documentsScanned:
          type: integer
          description: Documents whose text was actually read.
        anchorCount:
          type: integer
          description: Matches whose neighbourhood was collected.
        omittedAnchorCount:
          type: integer
          description: |
            Matches dropped by a per-document bound. The local scan bounds at 200
            per document.
        windowTokenCount:
          type: integer
          description: Surviving tokens inside the merged windows — the denominator.
        bounded:
          type: boolean
          description: |
            Whether a budget stopped the scan short of the whole scope. Keyed on
            what the scan was *offered*, never on what had text.
        minimumCount:
          type: integer
        cutoffCount:
          type: integer
          description: Smallest priced corpus count. `1` when every term is priced.
        generated:
          type: string
          format: date-time
        collocates:
          type: array
          items:
            $ref: "#/components/schemas/RankedTerm"

    TermDistributionResponse:
      type: object
      description: |
        One or more series over the requested buckets. A composite query returns
        one series per positive operand rather than a single total, because
        adding up occurrences of each would count two different things as one.
      required:
        - groupBy
        - measure
        - series
      properties:
        groupBy:
          type: string
          enum: [year, decade, volume, subseries, administration]
        measure:
          type: string
          enum: [documents, occurrences, dispersion]
        occurrenceAvailability:
          $ref: "#/components/schemas/OccurrenceAvailability"
        series:
          type: array
          items:
            type: object
            required:
              - term
              - buckets
            properties:
              term:
                type: string
                description: The operand this series counts.
              indexTerm:
                type: string
                description: |
                  The index term it resolved to, when one exists. Resolved by the
                  tokenizer that built the index rather than by a second
                  implementation, which could name a term the index never wrote.
              matchedDocumentCount:
                type: integer
                description: Documents matching across all buckets.
              occurrences:
                type: integer
                description: |
                  Instances across all buckets, when countable.
                  `SearchService.corpusTermProfile` gives the app the same pair
                  for one stem, but corpus-wide and unfiltered — over "the whole
                  local index, ignoring scope, date range and every other filter",
                  which is a different question from this one and which any
                  surface showing it has to say out loud.
              occurrencesPerDocument:
                type: number
                format: double
                description: |
                  Dispersion. A term concentrated in three documents and one spread
                  across 150 are different findings.
              undatedCount:
                type: integer
                description: |
                  Matching documents carrying no date, when `undatedPolicy` is
                  `separateBucket`. Reported rather than dropped: a histogram whose
                  bars sum to less than the match is otherwise unexplained.
              buckets:
                type: array
                items:
                  $ref: "#/components/schemas/TermDistributionBucket"

    TermDistributionBucket:
      type: object
      description: |
        One period or division, with its own denominator attached. The denominator
        travels with the numerator so a share can never be computed from two
        differently-filtered populations — the defect CA-4 fixed, and the reason
        the app's numerator and denominator apply byte-identical date rules.
      required:
        - key
        - matchedDocumentCount
        - corpusDocumentCount
      properties:
        key:
          type: string
          description: Bucket identifier — `1949`, `1940s`, `frus1949v01`, `truman`.
        label:
          type: string
          description: Display label.
        matchedDocumentCount:
          type: integer
          description: Matching documents in this bucket.
        occurrences:
          type: integer
          description: |
            Instances in this bucket. Absent when `occurrenceAvailability` says the
            query shape has no honest occurrence count — absent, never zero.
        corpusDocumentCount:
          type: integer
          description: |
            All corpus documents in this bucket, filtered identically. "182 hits in
            1949" means something different if 1949 has three times the documents.
        normalizedValue:
          type: number
          format: double
          description: |
            `matchedDocumentCount ÷ corpusDocumentCount`, or the occurrence
            equivalent when occurrences are the measure.

    OccurrenceAvailability:
      type: object
      description: |
        Whether a query's occurrences can be counted honestly, and if not, why —
        mirroring the `OccurrenceAvailability` enum, whose rule is that a count
        meaning something different per query shape is worse than no count. The
        client shows documents and states the reason; it never shows a zero or a
        blank cell.

        Which shapes are unavailable is a property of the **index**, not of the
        question. `exactWord` is impossible from a stemmed index at any cost, and
        `multiTermOperand` reflects instance-mode counting being per-term. A
        server holding a positional index, and if it chooses an unstemmed one, can
        report `available: true` for shapes the local implementation cannot —
        which is the substantive difference this endpoint offers. `compositeQuery`
        remains unavailable as a single total by construction: the honest answer
        is the per-operand series, which the response already carries.
      required:
        - available
      properties:
        available:
          type: boolean
        indexTerm:
          type: string
          description: The term being counted, when available.
        reason:
          type: string
          enum:
            - exactWord
            - multiTermOperand
            - compositeQuery
            - notASingleToken
            - noPositiveTerm
          description: |
            Why not, when unavailable. Matches `OccurrenceAvailability.Reason`
            case-for-case so a client can reuse its existing explanatory strings.
        explanation:
          type: string
          description: |
            One sentence for the researcher, stating what is true rather than what
            might change.

    ConcordanceLineList:
      type: object
      description: |
        Paginated concordance lines. `total` is the occurrence count across the
        whole match, which is the number a concordance is read against — not the
        document count, and not the size of this page.
      required:
        - total
        - documentsWithLines
        - documentsWithoutLines
        - omittedCount
        - items
      properties:
        total:
          type: integer
          description: Occurrences across the whole match.
        documentsWithLines:
          type: integer
        documentsWithoutLines:
          type: integer
          description: |
            Matched documents that produced no line. Locally this is a real
            possibility because alignment uses the Swift `PorterStemmer` while the
            match came from SQLite's; a server that matched and aligned with one
            tokenizer should report `0`, and the field is required so a client
            cannot mistake one situation for the other.
        omittedCount:
          type: integer
          description: Occurrences dropped by `maxLinesPerDocument`.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConcordanceLine"

    ConcordanceLine:
      type: object
      description: |
        One occurrence, with the text either side of it — a keyword-in-context
        line. One row per occurrence, not per document (decision R-3-1): a
        document that uses a phrase nine times *is* the finding, and collapsing it
        to one row hides what a concordance is for.
      required:
        - volumeId
        - documentId
        - left
        - keyword
        - right
        - characterOffset
      properties:
        volumeId:
          type: string
        documentId:
          type: string
        header:
          type: string
          description: Display header for the source document.
        dateISO:
          type:
            - string
            - "null"
          format: date
          description: Document date, for the date sort and for display.
        left:
          type: string
          description: Text before the match, trimmed to the context window.
        keyword:
          type: string
          description: |
            The matched text exactly as it appears in the document — not the stem,
            and not the query.
        right:
          type: string
          description: Text after the match.
        characterOffset:
          type: integer
          description: |
            Character offset of the match in the document body, which makes each
            line unique within a document and gives it a stable identity across
            re-sorts. Comparable to `DocumentHighlight.startOffset` when the
            document's rendering version is unchanged.
        page:
          type:
            - string
            - "null"
          description: Printed page the occurrence falls on, where known.

    SearchFacets:
      type: object
      description: |
        A result set broken down five ways, with every bound and coverage gap
        stated — the served form of `ResultSetFacets` (R-1a).
      required:
        - matchCount
        - undatedCount
      properties:
        matchCount:
          type: integer
          description: |
            Documents in the whole match — the denominator for every count here,
            supplied so no surface has to reach elsewhere for it.
        undatedCount:
          type: integer
          description: |
            Matched documents carrying no date, and so appearing in no year bucket.
        years:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
          description: Year of the document's start date, descending by year.
        volumes:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
        people:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
          description: |
            Resolved through the cross-corpus rollup, so one person is not split
            across name variants.
        documentTypes:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
          description: Primary document vs editorial note.
        provenance:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
          description: Archival-provenance era, from the parsed source notes.
        provenanceCoverage:
          type: object
          description: |
            How much of the match the provenance facet can actually speak for —
            **two** denominators, not one. *Parsed at all* and *named a record
            group* are different numbers: measured on the real store, 163,875 of
            195,613 matches had a parsed source note and only 141,718 of those
            named a record group. A panel reporting one figure for both overstates
            its own coverage.
          required:
            - parsed
            - withRecordGroup
          properties:
            parsed:
              type: integer
              description: Matched documents with a parsed source note of any kind.
            withRecordGroup:
              type: integer
              description: Matched documents whose source note named a record group.
        bounds:
          type: object
          description: |
            Per-section display bounds, keyed by section name. A section absent
            from this map was not truncated — the house rule is no silent
            truncation, and it matters at corpus scale: one common-term match
            spans 552 volumes and 14,615 person rollups, so a templated "of 47"
            would be wrong by two orders of magnitude.
          additionalProperties:
            type: object
            required:
              - shown
              - total
            properties:
              shown:
                type: integer
                description: Rows returned for this section.
              total:
                type: integer
                description: Distinct values the match actually contains.

    FacetBucket:
      type: object
      description: One facet value and its count over the whole match.
      required:
        - key
        - count
      properties:
        key:
          type: string
          description: |
            Value to narrow on. Written straight into the corresponding search
            filter field, since a facet row is a narrowing action as well as a
            description.
        label:
          type: string
          description: Display label.
        count:
          type: integer
          description: Matched documents carrying this value.

    # ── Related documents (v0.4.0) ───────────────────────────────────────────

    SimilarDocumentList:
      type: object
      description: |
        Lexical neighbours of an anchor document. `coverage` states what the
        result is a sample of, because the whole reason this is served rather than
        bundled is that a local index cannot say.
      required:
        - total
        - items
      properties:
        total:
          type: integer
          description: Neighbours above the score floor.
        minimumScore:
          type: number
          format: float
          description: The floor applied.
        crossVolumeShare:
          type: number
          format: float
          description: |
            Proportion of returned neighbours in volumes other than the anchor's.
            Diagnostic rather than decorative: the withdrawn on-device design
            reserved ≥80% cross-volume and that reservation is exactly what made
            it collapse against a small library.
        items:
          type: array
          items:
            $ref: "#/components/schemas/SimilarDocument"

    SimilarDocument:
      type: object
      description: One lexically similar document.
      required:
        - volumeId
        - documentId
        - score
      properties:
        volumeId:
          type: string
        documentId:
          type: string
        header:
          type: string
          description: Display header for the neighbour.
        dateISO:
          type:
            - string
            - "null"
          format: date
        score:
          type: number
          format: float
          description: |
            Cosine similarity in the lemma space, 0–1. Absolute, not normalised
            against the returned set: `RelatedDocumentsEngine` normalises each axis
            by its own maximum, so a sparse axis hands its single candidate a 1.0
            and outranks a genuine cross-reference partner 4× at the default
            weight. A raw score lets the client avoid inheriting that.
        sameVolume:
          type: boolean
          description: Whether the neighbour is inside the anchor's own volume.
        sharedTerms:
          type: array
          items:
            type: string
          description: |
            The terms that produced the match, most contributive first. The only
            way a researcher can check a similarity claim.
        citation:
          type: string
          description: |
            Formatted citation, so a neighbour in an undownloaded volume is
            immediately usable.
        volumeTitle:
          type: string
          description: Volume title, for a neighbour the client holds no manifest for.

    ReprintMatch:
      type: object
      description: |
        Another printing of the same document elsewhere in the series. Precision
        is the point: this is the ≥95-score band the similarity design treated as
        noise, isolated because it is verifiable by eye and useful precisely when
        the other volume is not downloaded.
      required:
        - volumeId
        - documentId
        - score
        - citation
      properties:
        volumeId:
          type: string
        documentId:
          type: string
        header:
          type: string
        dateISO:
          type:
            - string
            - "null"
          format: date
        score:
          type: number
          format: float
          description: Similarity, 0–1. Reprints sit at the top of the range.
        matchBasis:
          type: string
          enum: [identicalText, nearIdenticalText, editorialStatement]
          description: |
            How the reprint was established. `editorialStatement` means FRUS itself
            says so in a source note or editorial note, which is the strongest
            basis and needs no similarity threshold at all.
        citation:
          type: string
          description: |
            Formatted citation in the style `CitationFormatter` produces — the
            deliverable, not a pointer to one.
        volumeTitle:
          type: string
