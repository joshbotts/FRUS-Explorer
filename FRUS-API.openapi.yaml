openapi: 3.1.0

info:
  title: FRUS API
  version: 0.1.0-draft
  description: |
    # FRUS API — Living Specification

    This document describes the ideal FRUS API that could replace FRUS Explorer's
    current approach of calling the GitHub API for manifest data and downloading full
    volume XML files for local parsing.

    ## Purpose

    As FRUS Explorer is developed, each session that introduces a method calling:
    - The GitHub API (manifest, volume downloads)
    - Locally cached FRUS volume XML
    - The HistoryAtState GitHub repository in any form

    ...adds or updates the corresponding endpoint in this document, describing what
    a purpose-built FRUS API could deliver more efficiently.

    ## Status

    This is a living document, not a stable specification. All endpoints are drafts
    subject to revision as development proceeds. Endpoint definitions are added
    session by session as the corresponding client code is written.

    ## Rationale

    The current implementation:
    - Fetches the GitHub directory listing for `HistoryAtState/frus` volumes to get
      file sizes and SHAs (live manifest layer)
    - Downloads complete volume XML files (often 5–30 MB each) to extract metadata
      and full text locally

    A purpose-built FRUS API would deliver:
    - Rich volume metadata without requiring XML download
    - Pre-extracted document text for search indexing
    - Page range data for citation lookup
    - Subject tag appearances per volume

    This document captures what those endpoints would look like, serving as both
    a roadmap for a future official FRUS API and a reference for any future
    migration away from direct GitHub access.

  contact:
    name: Office of the Historian, U.S. Department of State
    url: https://history.state.gov

# Paths are populated session by session as client code is written.
# See DEVELOPMENT-PLAN.md for the session sequence.
paths:

  /volumes:
    get:
      summary: List all FRUS volumes
      description: |
        Returns the full volume manifest: metadata for every published, partially
        published, and planned FRUS volume.

        In the current implementation this data is bundled in `manifest.json`
        (generated by `ManifestGenerator` from TEI headers in the HistoryAtState
        GitHub repository). A future API would serve this endpoint directly.
      operationId: listVolumes
      tags:
        - Volumes
      responses:
        "200":
          description: Array of volume manifest entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolumeManifestEntry"

  /volumes/{volumeId}/download:
    get:
      summary: Download a FRUS volume XML file
      description: |
        Returns the full TEI XML for a single FRUS volume. In the current implementation
        this is served directly from the HistoryAtState GitHub repository via its raw
        content CDN (`raw.githubusercontent.com`). `DownloadManager` constructs the URL
        from the GitHub API directory listing and fetches it with `URLSession`.

        A purpose-built FRUS API would serve this endpoint with HTTP range support
        (for resumable downloads) and pre-compressed payloads.

        Added in Session 05 (Volume Download & Storage Manager).
      operationId: downloadVolume
      tags:
        - Volumes
      parameters:
        - name: volumeId
          in: path
          required: true
          schema:
            type: string
          description: Volume identifier, e.g. `frus1969-76v01`
      responses:
        "200":
          description: Full TEI XML content of the volume
          content:
            application/xml:
              schema:
                type: string
                format: binary
        "404":
          description: Volume not found

  /volumes/{volumeId}/page-ranges:
    get:
      summary: Page range table for a volume
      description: |
        Returns all page-break records extracted from the volume's TEI XML during
        indexing. Used by the Citation Lookup feature (Session 30) to resolve
        citations of the form "FRUS 1969–76 Vol. I, p. 47" to specific documents.

        Added by Session 30 (Citation Lookup) to the Session 09 indexing pipeline.
      operationId: getVolumePageRanges
      tags:
        - Volumes
        - Citation Lookup
      parameters:
        - name: volumeId
          in: path
          required: true
          schema:
            type: string
          description: Volume identifier, e.g. `frus1969-76v01`
      responses:
        "200":
          description: Array of page-range records for the volume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageRangeRecord"
        "404":
          description: Volume not found or not yet indexed

components:
  schemas:

    DateRange:
      type: object
      description: Inclusive date range covered by a volume.
      properties:
        earliest:
          type: string
          format: date
          nullable: true
          description: ISO 8601 date of the earliest document in the volume.
        latest:
          type: string
          format: date
          nullable: true
          description: ISO 8601 date of the latest document in the volume.

    VolumeManifestEntry:
      type: object
      description: |
        Rich metadata for a single FRUS volume, generated from its TEI header.
        The `tags` field contains volume-level subject tag slugs extracted from
        `/TEI/teiHeader/profileDesc/textClass/keywords[@scheme="https://history.state.gov/tags"]/term`.
        These are authoritative OH-curated tags embedded in published TEI.
      required:
        - volumeId
        - filename
        - subseries
        - title
        - dateRange
        - status
        - editors
        - documentCount
        - sizeBytes
        - tags
      properties:
        volumeId:
          type: string
          description: Stable volume identifier derived from the filename without extension.
          example: frus1969-76v01
        filename:
          type: string
          description: Original XML filename in the HistoryAtState/frus repository.
          example: frus1969-76v01.xml
        subseries:
          type: string
          description: Subseries identifier derived from the filename.
          example: "1969-76"
        title:
          type: string
          description: Full volume title from the TEI header.
        dateRange:
          $ref: "#/components/schemas/DateRange"
        publicationDate:
          type: string
          nullable: true
          description: ISO 8601 publication year or date; null if absent from the TEI header.
          example: "2003"
        status:
          type: string
          enum:
            - published
            - partiallyPublished
            - planned
          description: Publication status of the volume.
        editors:
          type: array
          items:
            type: string
          description: Named editors (excluding the general editor).
        generalEditor:
          type: string
          nullable: true
          description: General series editor, if named in the TEI header.
        documentCount:
          type: integer
          description: Approximate number of documents; may be 0 if not available from the header.
        sizeBytes:
          type: integer
          description: File size in bytes as reported by the GitHub API.
        tags:
          type: array
          items:
            type: string
          description: |
            Volume-level subject tag slugs from the TEI teiHeader
            (`keywords[@scheme="https://history.state.gov/tags"]`).
            Empty array is valid for volumes predating the tagging system.
          example:
            - kissinger-henry-a
            - iran
            - arms-control-and-disarmament

    PageRangeRecord:
      type: object
      description: |
        A single page-break record extracted from a volume's TEI XML during indexing.
        Used by the Citation Lookup engine (Session 30) to resolve page number
        references to specific documents and sections.
        Schema and population logic defined in Session 31 task file.
      required:
        - volumeId
        - documentId
        - pageNumber
        - pageNumberType
      properties:
        volumeId:
          type: string
          description: Volume this page break belongs to.
        documentId:
          type: string
          description: Document within the volume containing this page break.
        sectionId:
          type: string
          nullable: true
          description: Section or compilation grouping within the document, if applicable.
        pageNumber:
          type: string
          description: Raw `@n` attribute value from the `<pb>` element.
        pageNumberType:
          type: string
          enum:
            - arabic
            - roman
            - prefixed
            - unparseable
          description: Normalised page number type derived from the `@n` value.
