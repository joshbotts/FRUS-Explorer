# XcodeGen project specification for FRUS Explorer.
# Run `xcodegen generate` from the project root to regenerate FRUSExplorer.xcodeproj.
# This file is the authoritative source for project structure; edit it rather than
# modifying the .xcodeproj directly.

name: FRUSExplorer

options:
  bundleIdPrefix: bottsywattsy
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  defaultConfig: Debug
  xcodeVersion: "16.0"   # XcodeGen xcodeVersion; actual SDK is Xcode 26

# Three build configurations:
#   Debug              — development builds on all platforms
#   AppStore           — App Store release (iOS/iPadOS + macOS)
#   DirectDistribution — Developer ID release (macOS only; includes Sparkle)
configs:
  Debug: debug
  AppStore: release
  DirectDistribution: release

packages:
  # Sparkle: automatic update delivery for the Direct Distribution macOS build.
  # Linked only to FRUSExplorerMac target. iOS target does not link Sparkle.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    minorVersion: "2.0.0"

# ---------------------------------------------------------------------------
# Global build settings inherited by all targets
# ---------------------------------------------------------------------------
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
targets:

  # -------------------------------------------------------------------------
  # iOS / iPadOS Application
  # Supports iPhone (1) and iPad (2) via TARGETED_DEVICE_FAMILY.
  # App Store distribution only; single AppStore entitlement file.
  # -------------------------------------------------------------------------
  FRUSExplorer:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: bottsywattsy.FRUS-Explorer
    sources:
      - path: FRUSExplorer
      # FTS5Store source files are compiled directly into the app (not via SPM product linkage).
      - path: FTS5Store
    # XcodeGen generates Info.plist at info.path and sets INFOPLIST_FILE accordingly.
    # Using an explicit info section (instead of GENERATE_INFOPLIST_FILE) allows
    # UIBackgroundModes, which is an array and cannot be set via INFOPLIST_KEY_*.
    info:
      path: FRUSExplorer/Info.plist
      properties:
        CFBundleDisplayName: "FRUS Explorer"
        UIApplicationSupportsIndirectInputEvents: YES
        UILaunchScreen: {}
        # Required for Stage Manager multi-window support on M-chip iPads.
        # On iPhone this key is ignored; Stage Manager is iPad-only.
        UIApplicationSupportsMultipleScenes: YES
        # Required for CloudKit push notifications. Without this entry CloudKit
        # falls back to BGTaskScheduler background-fetch tasks and logs:
        # "BUG IN CLIENT OF CLOUDKIT: CloudKit push notifications require the
        #  'remote-notification' background mode in your info plist."
        UIBackgroundModes:
          - remote-notification
          - background-processing
        # Required by BGTaskScheduler: lists every task identifier this app may submit.
        # The 'indexing' task sustains IndexingPipeline work when the user switches away.
        BGTaskSchedulerPermittedIdentifiers:
          - bottsywattsy.FRUS-Explorer.indexing
        # Required for Handoff to route NSUserActivity instances to this app.
        NSUserActivityTypes:
          - com.joshbotts.frus-explorer.document
        # Required to call Activity.request() and start Live Activities.
        NSSupportsLiveActivities: YES
    dependencies:
      # Embed the widget extension so it is installed alongside the app.
      - target: FRUSExplorerWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: "FRUS Explorer"
        PRODUCT_BUNDLE_IDENTIFIER: "bottsywattsy.FRUS-Explorer"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 14
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "FRUSExplorer/FRUSExplorer-AppStore.entitlements"

  # -------------------------------------------------------------------------
  # macOS Application
  # Two release configs: AppStore and DirectDistribution.
  # DirectDistribution links Sparkle and uses the Developer ID entitlement file.
  # -------------------------------------------------------------------------
  FRUSExplorerMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    bundleId: bottsywattsy.FRUS-Explorer
    sources:
      - path: FRUSExplorer
      # FTS5Store source files are compiled directly into the app (not via SPM product linkage).
      - path: FTS5Store
    dependencies:
      # Sparkle is always present as a package dependency; actual linkage is
      # governed by EXCLUDED_SOURCE_FILE_NAMES / OTHER_LDFLAGS in non-DirectDistribution
      # configs. For now it is linked in all macOS configurations. In a future session,
      # conditional linking can be refined if needed.
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: "FRUS Explorer"
        PRODUCT_BUNDLE_IDENTIFIER: "bottsywattsy.FRUS-Explorer"
        CURRENT_PROJECT_VERSION: 14
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "FRUS Explorer"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.reference"
        INFOPLIST_KEY_NSUserActivityTypes: "com.joshbotts.frus-explorer.document"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "FRUSExplorer/FRUSExplorer-AppStore.entitlements"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: "FRUSExplorer/FRUSExplorer-AppStore.entitlements"
        AppStore:
          CODE_SIGN_ENTITLEMENTS: "FRUSExplorer/FRUSExplorer-AppStore.entitlements"
          CODE_SIGN_STYLE: Automatic
        DirectDistribution:
          CODE_SIGN_ENTITLEMENTS: "FRUSExplorer/FRUSExplorer-DirectDistribution.entitlements"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_SWIFT_FLAGS: "-DDIRECT_DISTRIBUTION"
          INFOPLIST_KEY_SUFeedURL: "https://frusexplorer.example.com/appcast.xml"

  # -------------------------------------------------------------------------
  # Widget Extension
  # Hosts the IndexingLiveActivity Live Activity (Dynamic Island + lock screen).
  # The IndexingActivityAttributes file is compiled into both this target and the
  # main app target — no shared framework is needed since the struct is small.
  # -------------------------------------------------------------------------
  FRUSExplorerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: bottsywattsy.FRUS-Explorer.widgets
    sources:
      - path: FRUSExplorerWidgets
      # Shared activity attributes struct — compiled into both the app and widget targets.
      - path: FRUSExplorer/Models/IndexingActivityAttributes.swift
    info:
      path: FRUSExplorerWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: FRUSExplorerWidgets
        PRODUCT_BUNDLE_IDENTIFIER: "bottsywattsy.FRUS-Explorer.widgets"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "FRUSExplorerWidgets/FRUSExplorerWidgets.entitlements"

  # -------------------------------------------------------------------------
  # Unit Tests
  # Runs on iOS simulator. Tests are platform-agnostic Swift and cover
  # AppState behaviour and entitlement file content.
  # Entitlement files are included as resources so tests can parse them.
  # -------------------------------------------------------------------------
  FRUSExplorerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: bottsywattsy.FRUS-Explorer.tests
    sources:
      - path: FRUSExplorerTests
    resources:
      - path: FRUSExplorer/FRUSExplorer-AppStore.entitlements
      - path: FRUSExplorer/FRUSExplorer-DirectDistribution.entitlements
    dependencies:
      - target: FRUSExplorer
    settings:
      base:
        PRODUCT_NAME: FRUSExplorerTests
        PRODUCT_BUNDLE_IDENTIFIER: "bottsywattsy.FRUS-Explorer.tests"

  # -------------------------------------------------------------------------
  # UI Tests
  # -------------------------------------------------------------------------
  FRUSExplorerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: bottsywattsy.FRUS-Explorer.uitests
    sources:
      - path: FRUSExplorerUITests
    dependencies:
      - target: FRUSExplorer
    settings:
      base:
        PRODUCT_NAME: FRUSExplorerUITests
        PRODUCT_BUNDLE_IDENTIFIER: "bottsywattsy.FRUS-Explorer.uitests"
