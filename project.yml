# XcodeGen project specification for FRUS Explorer.
# Run `xcodegen generate` from the project root to regenerate FRUSExplorer.xcodeproj.
# This file is the authoritative source for project structure; edit it rather than
# modifying the .xcodeproj directly.

name: FRUSExplorer

options:
  bundleIdPrefix: bottsywattsy
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  defaultConfig: Debug
  xcodeVersion: "16.0"   # XcodeGen xcodeVersion; actual SDK is Xcode 26

# Three build configurations:
#   Debug              — development builds on all platforms
#   AppStore           — App Store release (iOS/iPadOS + macOS)
#   DirectDistribution — Developer ID release (macOS only)
#
# Note: Sparkle (third-party auto-update) was evaluated for DirectDistribution
# in Session 128 but removed in Session 2026-06-07 — Apple rejects App Store/
# TestFlight submissions that bundle Sparkle.framework because its helper
# executables (Autoupdate, Updater.app, InstallerLauncher.xpc) lack the
# com.apple.security.app-sandbox entitlement, and Xcode project dependencies
# are linked per-*target* (not per-*config*), so Sparkle could not be limited
# to the DirectDistribution config alone without splitting FRUSExplorerMac
# into two targets. DirectDistribution users check for new releases manually
# (GitHub / project website) until/unless that restructuring is undertaken.
configs:
  Debug: debug
  AppStore: release
  DirectDistribution: release

# ---------------------------------------------------------------------------
# Global build settings inherited by all targets
# ---------------------------------------------------------------------------
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 828S8SXVLC
    # Xcode's "Update to recommended settings", adopted 2026-07-27. Declared HERE, not
    # accepted in the Xcode UI: `xcodegen generate` rewrites project.pbxproj wholesale, so
    # anything Xcode writes there is discarded on the next run. Each was checked before
    # adopting rather than taken on Xcode's word:
    #   - ENABLE_USER_SCRIPT_SANDBOXING is the one that can break a build, by denying a
    #     run-script phase access to files outside its declared inputs/outputs. This project
    #     has ZERO shell-script build phases, so there is nothing to deny.
    #   - STRING_CATALOG_GENERATE_SYMBOLS is a no-op today (no `.xcstrings` ships) and is
    #     adopted for whenever one does.
    #   - ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS turns
    #     `Image("LaunchAppTile")` into a compile-checked `Image(.launchAppTile)`.
    #
    # Xcode ALSO tried to rewrite the DirectDistribution `CODE_SIGN_IDENTITY` from
    # "Developer ID Application" to "Apple Development", which would break the notarized
    # DMG. That was NOT adopted; the correct value is declared below and xcodegen restores it.
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
targets:

  # -------------------------------------------------------------------------
  # iOS / iPadOS Application
  # Supports iPhone (1) and iPad (2) via TARGETED_DEVICE_FAMILY.
  # App Store distribution only; single AppStore entitlement file.
  # -------------------------------------------------------------------------
  FRUSExplorer:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: bottsywattsy.FRUS-Explorer
    sources:
      - path: FRUSExplorer
        # The generated Info.plist files are INFOPLIST_FILE inputs (see each target's `info:`),
        # not bundle resources. Exclude them from the shared source glob so neither platform's
        # plist is copied into the other's app bundle (both targets glob this same folder).
        excludes:
          - "Info.plist"
          - "Info-macOS.plist"
      # FTS5Store source files are compiled directly into the app (not via SPM product linkage).
      - path: FTS5Store
      # WordCloudKit source files are compiled directly into the app (not via SPM product
      # linkage), like FTS5Store and SourceNoteKit. The same sources are an SPM library
      # target so CloudVectorsGenerator tokenises the corpus through the app's own code
      # rather than a second copy — see Package.swift.
      - path: WordCloudKit
      # SourceNoteKit source files are compiled directly into the app (not via SPM product linkage).
      # eval-baseline.txt / eval-report.txt are the committed SourceNoteEvalGenerator
      # BEFORE/AFTER snapshots, not app content.
      - path: SourceNoteKit
        excludes:
          - "eval-baseline.txt"
          - "eval-report.txt"
      # TEIHeaderKit source files are compiled directly into the app, like the three above. The
      # app reads a SIDE-LOADED volume's own `<teiHeader>` with it (#777), and it has to be the
      # same grammar that built manifest.json — a second parser would drift, and the drift would
      # show up as a side-loaded volume whose metadata disagreed with the downloaded copy.
      - path: TEIHeaderKit
    # XcodeGen generates Info.plist at info.path and sets INFOPLIST_FILE accordingly.
    # Using an explicit info section (instead of GENERATE_INFOPLIST_FILE) allows
    # UIBackgroundModes, which is an array and cannot be set via INFOPLIST_KEY_*.
    info:
      path: FRUSExplorer/Info.plist
      properties:
        CFBundleDisplayName: "FRUS Explorer"
        # XcodeGen's generated Info.plist hardcodes CFBundleShortVersionString
        # "1.0" / CFBundleVersion "1" by default (InfoPlistGenerator.swift) —
        # these explicit $(...) substitutions override that, keeping this
        # target's marketing version / build number tied to the single
        # source of truth (MARKETING_VERSION / CURRENT_PROJECT_VERSION below)
        # so they can never silently drift out of sync with the macOS target.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance. Declares that the app uses no NON-EXEMPT encryption, which
        # is what stops App Store Connect asking on every single TestFlight upload.
        # Basis, checked rather than assumed: the app's only CryptoKit use is HASHING —
        # SHA-256 digests for cache keys, scope signatures and the schema inventory, plus
        # one Insecure.SHA1 in DownloadManager. Hashing is not encryption. Everything else
        # is Apple-provided and exempt: HTTPS through URLSession, and the Keychain. There
        # is no symmetric or asymmetric cipher anywhere in the app.
        ITSAppUsesNonExemptEncryption: false
        # App Store category — kept in sync with the macOS target. (For iOS,
        # App Store Connect's listing metadata is authoritative, but Xcode
        # uses this key to pre-fill that field on first submission, and it
        # keeps the Info.plist sources consistent across platforms.)
        LSApplicationCategoryType: "public.app-category.reference"
        UIApplicationSupportsIndirectInputEvents: YES
        # Launch screen — the static half of Workstream O's option (a).
        #
        # This was `UILaunchScreen: {}`, an empty dictionary, which draws a blank white
        # screen for the whole pre-render window. O-0's Time Profiler trace measured
        # `FRUSExplorerApp.init()` at 158 ms — 137 ms of it `makeFRUSContainer()`, a
        # synchronous SwiftData store open with nothing in it to delete — so that window is
        # real, is not going away, and is the only part of launch a SwiftUI overlay can
        # never reach.
        #
        # `UILaunchScreen` and `UILaunchStoryboardName` are mutually exclusive: iOS 14+
        # prefers the dictionary if BOTH are present, which would silently ignore the
        # storyboard. The dictionary is therefore removed, not left alongside.
        UILaunchStoryboardName: LaunchScreen
        # Multi-window support (Stage Manager / iPadOS windowed apps). This key MUST be nested
        # under `UIApplicationSceneManifest` — a TOP-LEVEL `UIApplicationSupportsMultipleScenes`
        # is silently ignored by iOS, which left `@Environment(\.supportsMultipleWindows)` FALSE
        # and made iPad multi-window entirely non-functional (the "Open in New Window" affordances
        # stayed hidden and every `openWindow(value:)` was a no-op). No `UISceneConfigurations`:
        # SwiftUI's App/WindowGroup DSL owns scene configuration. iPhone reports single-window either way.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Required for CloudKit push notifications. Without this entry CloudKit
        # falls back to BGTaskScheduler background-fetch tasks and logs:
        # "BUG IN CLIENT OF CLOUDKIT: CloudKit push notifications require the
        #  'remote-notification' background mode in your info plist."
        # NOTE: the Info.plist string value for the BGTaskScheduler "background
        # processing" mode is 'processing' — NOT 'background-processing'.
        # 'background-processing' is rejected by App Store validation (error
        # 90112, "Invalid Info.plist value").
        UIBackgroundModes:
          - remote-notification
          - processing
        # Required by BGTaskScheduler: lists every task identifier this app may submit.
        # The 'indexing' task sustains IndexingPipeline work when the user switches away.
        BGTaskSchedulerPermittedIdentifiers:
          - bottsywattsy.FRUS-Explorer.indexing
        # App Store validation (error 90474) requires all four orientations
        # for any app that supports iPad multitasking
        # (UIApplicationSupportsMultipleScenes, set below). XcodeGen's default
        # Info.plist generation supplies only Portrait + both Landscape
        # orientations; declare the full set explicitly — including
        # PortraitUpsideDown — so the requirement is met on every regeneration.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required for Handoff to route NSUserActivity instances to this app.
        NSUserActivityTypes:
          - com.joshbotts.frus-explorer.document
        # Required to call Activity.request() and start Live Activities.
        NSSupportsLiveActivities: YES
        # Native shareable collection file (.fruscollection) — Phase 4 / D9. Declares the
        # exported UTI and registers the app as an editor for it, so opening a file (share
        # sheet → "Copy to FRUS Explorer", Files, AirDrop) routes to the app's onOpenURL.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: bottsywattsy.FRUS-Explorer.fruscollection
            UTTypeDescription: FRUS Collection
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - fruscollection
        CFBundleDocumentTypes:
          - CFBundleTypeName: FRUS Collection
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - bottsywattsy.FRUS-Explorer.fruscollection
        # App Store validation ("Missing Document Configuration") requires any app that
        # declares CFBundleDocumentTypes to also set UISupportsDocumentBrowser or
        # LSSupportsOpeningDocumentsInPlace. The app opens .fruscollection files via
        # onOpenURL (no UIDocumentBrowserViewController), so YES = open the file in place
        # (Apple-recommended): importOpenedCollection() already brackets the read in
        # start/stopAccessingSecurityScopedResource and only reads (never writes back), so
        # in-place read-only is correct — and it avoids the Documents/Inbox copies a NO
        # value would leave behind uncleaned. macOS doesn't use this key (NSDocument model).
        LSSupportsOpeningDocumentsInPlace: YES
    dependencies:
      # Embed the widget extension so it is installed alongside the app.
      - target: FRUSExplorerWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: "FRUS Explorer"
        # Swift derives the module name from PRODUCT_NAME by default,
        # sanitizing the space to an underscore ("FRUS_Explorer") — but
        # every test file does `@testable import FRUSExplorer` (no space,
        # no underscore), matching the *target* name. Pin the module name
        # explicitly so `@testable import FRUSExplorer` resolves; otherwise
        # every test file fails to build with "unable to resolve module
        # dependency: 'FRUSExplorer'".
        PRODUCT_MODULE_NAME: FRUSExplorer
        PRODUCT_BUNDLE_IDENTIFIER: "bottsywattsy.FRUS-Explorer"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 40
        MARKETING_VERSION: "0.2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "FRUSExplorer/FRUSExplorer-iOS.entitlements"

  # -------------------------------------------------------------------------
  # macOS Application
  # Two release configs: AppStore and DirectDistribution.
  # DirectDistribution uses the Developer ID entitlement file and Manual signing;
  # see the `configs:` comment above re: why Sparkle auto-update isn't linked.
  # -------------------------------------------------------------------------
  FRUSExplorerMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    bundleId: bottsywattsy.FRUS-Explorer
    sources:
      - path: FRUSExplorer
        # The generated Info.plist files are INFOPLIST_FILE inputs (see each target's `info:`),
        # not bundle resources. Exclude them from the shared source glob so neither platform's
        # plist is copied into the other's app bundle (both targets glob this same folder).
        excludes:
          - "Info.plist"
          - "Info-macOS.plist"
          # macOS has no launch screen, and this is not merely dead weight here: `ibtool
          # --target-device mac` HARD-ERRORS on an iOS storyboard ("iOS storyboards do not
          # support target device type 'mac'"), so leaving it in the shared glob breaks
          # the macOS build outright.
          - "Resources/LaunchScreen.storyboard"
      # FTS5Store source files are compiled directly into the app (not via SPM product linkage).
      - path: FTS5Store
      # WordCloudKit source files are compiled directly into the app (not via SPM product
      # linkage), like FTS5Store and SourceNoteKit. The same sources are an SPM library
      # target so CloudVectorsGenerator tokenises the corpus through the app's own code
      # rather than a second copy — see Package.swift.
      - path: WordCloudKit
      # SourceNoteKit source files are compiled directly into the app (not via SPM product linkage).
      # eval-baseline.txt / eval-report.txt are the committed SourceNoteEvalGenerator
      # BEFORE/AFTER snapshots, not app content.
      - path: SourceNoteKit
        excludes:
          - "eval-baseline.txt"
          - "eval-report.txt"
      # TEIHeaderKit source files are compiled directly into the app, like the three above. The
      # app reads a SIDE-LOADED volume's own `<teiHeader>` with it (#777), and it has to be the
      # same grammar that built manifest.json — a second parser would drift, and the drift would
      # show up as a side-loaded volume whose metadata disagreed with the downloaded copy.
      - path: TEIHeaderKit
    # Explicit Info.plist (was GENERATE_INFOPLIST_FILE + INFOPLIST_KEY_*). Switched to an
    # explicit plist because CFBundleDocumentTypes / UTExportedTypeDeclarations are arrays of
    # dictionaries that cannot be expressed via INFOPLIST_KEY_* (same reason the iOS target
    # uses an explicit plist for UIBackgroundModes). Mirrors the iOS keys plus the .fruscollection
    # document type. A distinct path from the iOS Info.plist so the two don't collide. Version
    # keys are pinned to $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION) so XcodeGen's default
    # "1.0"/"1" can't leak into a notarized/App Store build.
    info:
      path: FRUSExplorer/Info-macOS.plist
      properties:
        CFBundleDisplayName: "FRUS Explorer"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance. Declares that the app uses no NON-EXEMPT encryption, which
        # is what stops App Store Connect asking on every single TestFlight upload.
        # Basis, checked rather than assumed: the app's only CryptoKit use is HASHING —
        # SHA-256 digests for cache keys, scope signatures and the schema inventory, plus
        # one Insecure.SHA1 in DownloadManager. Hashing is not encryption. Everything else
        # is Apple-provided and exempt: HTTPS through URLSession, and the Keychain. There
        # is no symmetric or asymmetric cipher anywhere in the app.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: "public.app-category.reference"
        NSUserActivityTypes:
          - com.joshbotts.frus-explorer.document
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: bottsywattsy.FRUS-Explorer.fruscollection
            UTTypeDescription: FRUS Collection
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - fruscollection
        CFBundleDocumentTypes:
          - CFBundleTypeName: FRUS Collection
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - bottsywattsy.FRUS-Explorer.fruscollection
    settings:
      base:
        PRODUCT_NAME: "FRUS Explorer"
        PRODUCT_BUNDLE_IDENTIFIER: "bottsywattsy.FRUS-Explorer"
        CURRENT_PROJECT_VERSION: 40
        MARKETING_VERSION: "0.2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "FRUSExplorer/FRUSExplorer-AppStore.entitlements"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: "FRUSExplorer/FRUSExplorer-AppStore.entitlements"
        AppStore:
          CODE_SIGN_ENTITLEMENTS: "FRUSExplorer/FRUSExplorer-AppStore.entitlements"
          CODE_SIGN_STYLE: Automatic
        DirectDistribution:
          CODE_SIGN_ENTITLEMENTS: "FRUSExplorer/FRUSExplorer-DirectDistribution.entitlements"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"

  # -------------------------------------------------------------------------
  # Widget Extension
  # Hosts the IndexingLiveActivity Live Activity (Dynamic Island + lock screen).
  # The IndexingActivityAttributes file is compiled into both this target and the
  # main app target — no shared framework is needed since the struct is small.
  # -------------------------------------------------------------------------
  FRUSExplorerWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: bottsywattsy.FRUS-Explorer.widgets
    sources:
      - path: FRUSExplorerWidgets
      # Shared activity attributes struct — compiled into both the app and widget targets.
      - path: FRUSExplorer/Models/IndexingActivityAttributes.swift
    info:
      path: FRUSExplorerWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # App Store validation (error 90360) requires every embedded bundle —
        # including extensions — to declare CFBundleDisplayName. XcodeGen's
        # default Info.plist generation for app-extension targets omits it.
        CFBundleDisplayName: "FRUS Explorer Widgets"
        # App Store validation requires an embedded extension's marketing version
        # and build number to match its host app's — override XcodeGen's
        # hardcoded "1.0"/"1" Info.plist defaults the same way the FRUSExplorer
        # iOS target does, tying both to MARKETING_VERSION/CURRENT_PROJECT_VERSION
        # below (which mirror the host app's values; see CLAUDE.md's build-number
        # bump procedure for keeping all three in lockstep).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_NAME: FRUSExplorerWidgets
        PRODUCT_BUNDLE_IDENTIFIER: "bottsywattsy.FRUS-Explorer.widgets"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "FRUSExplorerWidgets/FRUSExplorerWidgets.entitlements"
        # Must match the host FRUSExplorer app's values (see its target settings
        # and CLAUDE.md's build-number bump procedure) — App Store validation
        # rejects extensions whose CFBundleShortVersionString/CFBundleVersion
        # don't match their containing app's.
        CURRENT_PROJECT_VERSION: 40
        MARKETING_VERSION: "0.2"

  # -------------------------------------------------------------------------
  # Unit Tests
  # Runs on iOS simulator. Tests are platform-agnostic Swift and cover
  # AppState behaviour and entitlement file content.
  # Entitlement files are included as resources so tests can parse them.
  # -------------------------------------------------------------------------
  FRUSExplorerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: bottsywattsy.FRUS-Explorer.tests
    sources:
      - path: FRUSExplorerTests
      # The collection-authority generator's document-note extractor, compiled into
      # the test bundle so RealTEINoteParityTests can pin generator↔app note parity
      # (the extractor must reproduce exactly the notes IndexingPipeline stores).
      # Only this one file — it depends on Foundation alone.
      - path: CollectionAuthorityGeneratorCore/DocumentNoteExtractor.swift
      # Its #784 sibling, for RealTEIFootnoteParityTests: the generator's body-footnote
      # pass must find the same citations the pipeline's AST walk writes to
      # external_citations. Foundation only, same as above.
      - path: CollectionAuthorityGeneratorCore/DocumentFootnoteExtractor.swift
    resources:
      - path: FRUSExplorer/FRUSExplorer-iOS.entitlements
      - path: FRUSExplorer/FRUSExplorer-AppStore.entitlements
      - path: FRUSExplorer/FRUSExplorer-DirectDistribution.entitlements
    dependencies:
      - target: FRUSExplorer
    settings:
      base:
        PRODUCT_NAME: FRUSExplorerTests
        PRODUCT_BUNDLE_IDENTIFIER: "bottsywattsy.FRUS-Explorer.tests"
        # Required for code signing — without it, Xcode reports "Cannot code
        # sign because the target does not have an Info.plist file and one
        # is not being generated automatically." This was previously masked
        # by the TEST_HOST failure above (a scheme-validation error that
        # occurs before the build/codesign phase even starts).
        GENERATE_INFOPLIST_FILE: YES
        # Explicit TEST_HOST / BUNDLE_LOADER are required because the host
        # app's PRODUCT_NAME ("FRUS Explorer", with a space — see the
        # FRUSExplorer target above) differs from its target name
        # ("FRUSExplorer"). XcodeGen/Xcode auto-derive TEST_HOST from the
        # *target* name, producing "FRUSExplorer.app/FRUSExplorer" — a path
        # that doesn't exist on disk (the real product is
        # "FRUS Explorer.app/FRUS Explorer"). Without this override, every
        # `xcodebuild test` invocation fails up front with "Could not find
        # test host for FRUSExplorerTests" before any test code runs.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FRUS Explorer.app/FRUS Explorer"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # -------------------------------------------------------------------------
  # UI Tests
  # -------------------------------------------------------------------------
  FRUSExplorerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: bottsywattsy.FRUS-Explorer.uitests
    sources:
      - path: FRUSExplorerUITests
    dependencies:
      - target: FRUSExplorer
    settings:
      base:
        PRODUCT_NAME: FRUSExplorerUITests
        PRODUCT_BUNDLE_IDENTIFIER: "bottsywattsy.FRUS-Explorer.uitests"
        # See FRUSExplorerTests above — same "Cannot code sign" failure
        # without an Info.plist source.
        GENERATE_INFOPLIST_FILE: YES
